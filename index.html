// ── Shared: Icon ─────────────────────────────────────────────────────────────
function Icon({ name, size = 16, color = 'currentColor' }) {
  const ref = useRef(null);
  useEffect(() => {
    if (!ref.current || !window.lucide) return;
    const iconFn = window.lucide[name];
    if (!iconFn) return;
    const [, attrs, children] = typeof iconFn === 'function' ? iconFn() : iconFn;
    const ns = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(ns, 'svg');
    Object.entries({ ...attrs, width: size, height: size, color }).forEach(([k,v]) => svg.setAttribute(k,v));
    svg.style.display = 'block';
    (children||[]).forEach(([ct,ca]) => {
      const c = document.createElementNS(ns, ct);
      Object.entries(ca||{}).forEach(([k,v]) => c.setAttribute(k,v));
      svg.appendChild(c);
    });
    ref.current.innerHTML = '';
    ref.current.appendChild(svg);
  }, [name, size, color]);
  return <span ref={ref} style={{ display:'inline-flex', alignItems:'center', justifyContent:'center', lineHeight:0, flexShrink:0 }} />;
}

function StartupsPage({ setPage }) {

  const ALL_TAGS = ['All', ...Array.from(new Set(PUBLIC_STARTUPS.flatMap(s => s.tags))).sort()];

  const filtered = PUBLIC_STARTUPS.filter(s => {
    const q = query.toLowerCase();
    const matchQ = s.name.toLowerCase().includes(q) || s.tags.some(t => t.toLowerCase().includes(q));
    const matchT = tagFilter === 'All' || s.tags.includes(tagFilter);
    return matchQ && matchT;
  });

  const isFiltered = query !== '' || tagFilter !== 'All';

  function reset() {
    setQuery('');

  const [touched,     setTouched]     = useState({ email: false, password: false });

  function validateEmail(val) {
    if (!val.trim()) return 'Email address is required.';
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val.trim())) return 'Enter a valid email address.';
    return '';
  }

  function handleEmailBlur() {
    setTouched(t => ({ ...t, email: true }));
    setEmailError(validateEmail(email));
  }

  function handleSubmit() {
    const err = validateEmail(email);

          <h1 className="login-heading">Sign in to your account</h1>
          <p className="login-subheading">Access your dashboard to manage challenges, proposals and pilots.</p>

          {/* Email */}
          <div className="login-field">
            <label className="login-label" htmlFor="login-email">Email address</label>
            <input
              id="login-email"
              className={`login-input${touched.email && emailError ? ' login-input-error' : ''}`}
              type="email"
              placeholder="you@organisation.gov"
              value={email}
              onChange={e => { setEmail(e.target.value); if (touched.email) setEmailError(validateEmail(e.target.value)); }}
              onBlur={handleEmailBlur}
              autoComplete="email"
              aria-describedby={touched.email && emailError ? 'email-error' : undefined}
            />
            {touched.email && emailError && (
              <div className="login-field-error" id="email-error" role="alert">
                <Icon name="AlertCircle" size={13} color="#dc2626" />
                {emailError}
              </div>
            )}
          </div>

          {/* Password */}
          <div className="login-field">
            <label className="login-label" htmlFor="login-password">Password</label>
            <div className="login-pw-wrap">
              <input
                id="login-password"
                className="login-input"
                type={showPw ? 'text' : 'password'}
                placeholder="Enter your password"
                value={password}
                onChange={e => setPassword(e.target.value)}
                onBlur={() => setTouched(t => ({ ...t, password: true }))}
                autoComplete="current-password"
              />
              <button
                type="button"
                className="login-pw-toggle"
                onClick={() => setShowPw(v => !v)}
                aria-label={showPw ? 'Hide password' : 'Show password'}
              >
                <Icon name={showPw ? 'EyeOff' : 'Eye'} size={16} color="#667085" />
              </button>
            </div>
          </div>

          {/* Submit */}
          <button className="login-submit-btn" onClick={handleSubmit}>
            <Icon name="LogIn" size={16} color="#fff" /> Sign In
          </button>

          {/* Register link */}
          <p className="login-register-link">
            Don't have an account?{' '}
            <button className="login-link-btn" onClick={() => setPage('register')}>Get Started</button>
          </p>

          {/* Demo notice */}
          <div className="login-demo-notice">
            <Icon name="Info" size={14} color="#b45309" />
            <div>
              <strong>Demo prototype.</strong> No real authentication exists. Entering any email and password and clicking Sign In will route you to role selection. No credentials are verified or stored.
            </div>
          </div>

          {/* Back link */}
          <button className="login-back-btn" onClick={() => setPage('home')}>
            <Icon name="ArrowLeft" size={13} color="#667085" /> Back to homepage
          </button>
        </div>
      </div>
    </div>
  );
}

            <div className="dropdown-divider" />
            <div className="dropdown-item" style={{ color:'#ef4444' }}>
              <Icon name="LogOut" size={14} color="#ef4444" /> Sign Out
            </div>
          </div>
        )}
      </div>
    </header>
  );
}

function SummaryCards() {
  return (
    <div className="summary-grid">
      {SUMMARY_CARDS.map(c => (
        <div key={c.label} className="summary-card fade-in">
          <div className="summary-icon" style={{ background:c.bg }}>
            <Icon name={c.icon} size={20} color={c.color} />
          </div>
          <div>
            <div className="summary-value">{c.value}</div>
            <div className="summary-label">{c.label}</div>
          </div>
        </div>
      ))}
    </div>
  );
}

function ChallengesCard({ onView }) {
  const [query, setQuery] = useState('');
  const filtered = CHALLENGES.filter(c =>
    c.name.toLowerCase().includes(query.toLowerCase()) ||
    c.stage.toLowerCase().includes(query.toLowerCase())
  );
  return (
    <div className="card">
      <div className="card-header">
        <span className="card-title">My Government Challenges</span>
        <div className="search-wrap" style={{ maxWidth:200 }}>
          <span className="search-icon"><Icon name="Search" size={13} color="#667085" /></span>
          <input type="text" placeholder="Filter challenges…" value={query} onChange={e => setQuery(e.target.value)} aria-label="Filter challenges" />
        </div>
      </div>
      <div className="table-wrap">
        <table>
          <thead><tr>{['Challenge','Applications','Stage','Deadline','Action'].map(h=><th key={h}>{h}</th>)}</tr></thead>
          <tbody>
            {filtered.length === 0
              ? <tr><td colSpan={5} style={{ textAlign:'center', padding:'32px 16px', color:'#667085', fontSize:13 }}>No challenges match your filter.</td></tr>
              : filtered.map(c => (
                <tr key={c.id}>
                  <td style={{ fontWeight:500 }}>{c.name}</td>
                  <td style={{ color:'#667085' }}>{c.apps}</td>
                  <td><span className={`badge ${c.badge}`}>{c.stage}</span></td>
                  <td style={{ color:'#667085' }}>{c.deadline}</td>
                  <td><button className="view-link" onClick={() => onView(c)}>View</button></td>
                </tr>
              ))
            }
          </tbody>
        </table>
      </div>
      <div style={{ padding:'10px 16px', borderTop:'1px solid #E5EAF1' }}>
        <button className="view-link" style={{ fontSize:12 }}>View All Challenges →</button>
      </div>
    </div>
  );
}

function StartupsCard() {
  return (
    <div className="card">
      <div className="card-header">
        <span className="card-title">Recommended Startups</span>
        <button className="btn-secondary" style={{ fontSize:12, padding:'5px 12px' }}>View All</button>
      </div>
      <div className="startup-list">
        {STARTUPS.map(s => (
          <div key={s.id} className="startup-card">
            <div className="startup-avatar" style={{ background:s.color }}>{s.initials}</div>
            <div style={{ flex:1, minWidth:0 }}>
              <div style={{ display:'flex', alignItems:'center', gap:8, flexWrap:'wrap' }}>
                <span className="startup-name">{s.name}</span>
                <span className="match-pill">
                  <Icon name="TrendingUp" size={10} color="#0a7a6e" /> {s.match}% match
                </span>
              </div>
              <div className="tag-list">
                {s.tags.map(t => <span key={t} className="tag">{t}</span>)}
              </div>
            </div>
            <button className="btn-secondary" style={{ fontSize:12, padding:'5px 12px', flexShrink:0 }}>View Profile</button>
          </div>
        ))}
      </div>
    </div>
  );
}

function WorkflowSection() {
  return (
    <div className="workflow-section fade-in">
      <div className="workflow-title">Innovation Workflow</div>
      <div className="workflow-track">
        {WORKFLOW_STEPS.map(step => (
          <div key={step.id} className={`workflow-step${step.state==='active'?' active-step':step.state==='done'?' done-step':''}`}>
            <div className="step-circle">
              <Icon name={step.icon} size={16} color={step.state==='done'?'#fff':step.state==='active'?'#0F9D8A':'#667085'} />
            </div>
            <div className="step-label">
              {step.label.split('\n').map((line,i) => <span key={i} style={{ display:'block' }}>{line}</span>)}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function ChallengeModal({ challenge, onClose }) {
  useEffect(() => {
    const onKey = e => { if (e.key==='Escape') onClose(); };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [onClose]);
  return (
    <div className="modal-overlay" onClick={e => { if (e.target===e.currentTarget) onClose(); }}>
      <div className="modal-box">
        <div className="modal-header">
          <span className="modal-title">{challenge.name}</span>
          <button className="icon-btn" onClick={onClose} aria-label="Close"><Icon name="X" size={16} /></button>
        </div>
        <div className="modal-body">
          <p style={{ fontSize:13, color:'#667085', marginBottom:16, lineHeight:1.6 }}>{challenge.desc}</p>
          {[['Department',challenge.dept],['Applications',challenge.apps],['Current Stage',challenge.stage],['Deadline',challenge.deadline]].map(([label,value]) => (
            <div key={label} className="detail-row">
              <span className="detail-label">{label}</span>
              <span className="detail-value">
                {label==='Current Stage' ? <span className={`badge ${challenge.badge}`}>{value}</span> : value}
              </span>
            </div>
          ))}
        </div>
        <div className="modal-footer">
          <button className="btn-secondary" onClick={onClose}>Close</button>
          <button className="btn-primary"><Icon name="ExternalLink" size={14} color="#fff" /> Open Full View</button>
        </div>
      </div>
    </div>
  );
}

function PostChallengeModal({ onClose }) {
  const [form, setForm] = useState({ title:'', dept:'', deadline:'', desc:'' });
  const set = k => e => setForm(f => ({ ...f, [k]: e.target.value }));
  useEffect(() => {
    const onKey = e => { if (e.key==='Escape') onClose(); };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [onClose]);
  return (
    <div className="modal-overlay" onClick={e => { if (e.target===e.currentTarget) onClose(); }}>
      <div className="modal-box">
        <div className="modal-header">
          <span className="modal-title">Post New Challenge</span>
          <button className="icon-btn" onClick={onClose} aria-label="Close"><Icon name="X" size={16} /></button>
        </div>
        <div className="modal-body">
          <div className="form-group">
            <label className="form-label">Challenge Title</label>
            <input className="form-input" placeholder="e.g. Smart Street Lighting" value={form.title} onChange={set('title')} />
          </div>
          <div className="form-group">
            <label className="form-label">Department</label>
            <select className="form-select" value={form.dept} onChange={set('dept')}>
              <option value="">Select department…</option>
              {['Sanitation','Transport','Water Authority','Urban Planning','Energy'].map(d => (
                <option key={d} value={d}>{d}</option>
              ))}
            </select>
          </div>
          <div className="form-group">
            <label className="form-label">Application Deadline</label>
            <input type="date" className="form-input" value={form.deadline} onChange={set('deadline')} />
          </div>
          <div className="form-group">
            <label className="form-label">Description</label>
            <textarea className="form-textarea" placeholder="Describe the challenge and expected outcomes…" value={form.desc} onChange={set('desc')} />
          </div>
        </div>
        <div className="modal-footer">
          <button className="btn-secondary" onClick={onClose}>Cancel</button>
          <button className="btn-primary"><Icon name="Send" size={14} color="#fff" /> Submit Challenge</button>
        </div>
      </div>
    </div>
  );
}

function DashboardPage() {
  const [viewChallenge, setViewChallenge] = useState(null);
  const [postOpen, setPostOpen]           = useState(false);
  return (
    <div className="page-content fade-in">
      <div className="welcome-bar">
        <div>
          <h1 style={{ fontSize:20, fontWeight:700, color:'#182230', margin:0 }}>Welcome back, Municipal Corporation</h1>
          <p style={{ fontSize:13, color:'#667085', marginTop:4, marginBottom:0 }}>Manage challenges, discover suitable startups and track solution performance.</p>
        </div>
        <button className="btn-primary" onClick={() => setPostOpen(true)}>
          <Icon name="Plus" size={15} color="#fff" /> Post New Challenge
        </button>
      </div>
      <SummaryCards />
      <div className="dashboard-grid">
        <ChallengesCard onView={setViewChallenge} />
        <StartupsCard />
      </div>
      <WorkflowSection />
      {viewChallenge && <ChallengeModal challenge={viewChallenge} onClose={() => setViewChallenge(null)} />}
      {postOpen      && <PostChallengeModal onClose={() => setPostOpen(false)} />}
    </div>
  );
}

function GovInnerPage({ title }) {
  return (
    <div className="page-content fade-in" style={{ display:'flex', alignItems:'center', justifyContent:'center', minHeight:400 }}>
      <div style={{ textAlign:'center' }}>
        <div style={{ width:56, height:56, borderRadius:16, background:'#EBF2FF', display:'flex', alignItems:'center', justifyContent:'center', margin:'0 auto 16px' }}>
          <Icon name="Construction" size={24} color="#173C70" />
        </div>
        <h2 style={{ fontSize:18, fontWeight:700, color:'#182230', margin:'0 0 8px' }}>{title}</h2>
        <p style={{ fontSize:13, color:'#667085', margin:0 }}>This section is coming soon.</p>
      </div>
    </div>
  );
}

const GOV_PAGE_TITLES = {
  challenges:'My Challenges', post:'Post Challenge', matches:'Startup Matches',
  proposals:'Proposals', evaluation:'Evaluation', pilot:'Pilot Tracking',
  performance:'Performance', settings:'Settings',
};

function GovDashboard({ setPage }) {
  const [activeNav, setActiveNav]               = useState('dashboard');
  const [sidebarCollapsed, setSidebarCollapsed] = useState(false);
  return (
    <div className="app-shell">
      <GovSidebar active={activeNav} onSelect={setActiveNav} collapsed={sidebarCollapsed} onExit={() => setPage('home')} />
      <div className="main-area">
        <GovHeader onToggleSidebar={() => setSidebarCollapsed(c => !c)} />
        {activeNav === 'dashboard'
          ? <DashboardPage />
          : <GovInnerPage title={GOV_PAGE_TITLES[activeNav] || activeNav} />
        }
      </div>
    </div>
  );
}

// ── Top-level App Router ──────────────────────────────────────────────────────
function App() {
  const [page, setPage] = useState('home');

  // Pages that use the full-screen dashboard shell (no public nav/footer)
  const dashboardPages = ['govDashboard', 'startupDashboard', 'evaluatorDashboard'];
  const authPages      = ['login', 'register', 'roleSelect'];

  if (page === 'govDashboard')       return <GovDashboard setPage={setPage} />;
  if (page === 'startupDashboard')   return <StartupDashboard setPage={setPage} />;
  if (page === 'evaluatorDashboard') return <EvaluatorDashboard setPage={setPage} />;
  if (page === 'login')              return <LoginPage setPage={setPage} />;
  if (page === 'register' || page === 'roleSelect') return <RoleSelectPage setPage={setPage} />;

  // Public site pages — wrapped with nav + footer
  const renderPage = () => {
    if (page === 'home')       return <HomePage setPage={setPage} />;
    if (page === 'challenges') return <ChallengesPage setPage={setPage} />;
    if (page === 'startups')   return <StartupsPage setPage={setPage} />;
    if (page === 'how')        return <HowItWorksPage setPage={setPage} />;
    if (page === 'about')      return <AboutPage setPage={setPage} />;
    return <HomePage setPage={setPage} />;
  };

  return (
    <div style={{ minHeight:'100vh', display:'flex', flexDirection:'column', background:'#fff' }}>
      <PublicNav page={page} setPage={setPage} />
      <div style={{ flex:1 }}>
        {renderPage()}
      </div>
      <PublicFooter setPage={setPage} />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
