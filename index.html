    <div className="modal-overlay sm-modal" onClick={event => { if (event.target === event.currentTarget) onClose(); }}>
      <div className="modal-box" role="dialog" aria-modal="true" aria-labelledby="sm-review-heading">
        <form onSubmit={submit} noValidate>
          <div className="modal-header">
            <span className="modal-title" id="sm-review-heading">Review {match.name}</span>
            <button type="button" className="icon-btn" onClick={onClose} aria-label="Close review"><Icon name="X" size={16} /></button>
          </div>
          <div className="modal-body">
            <div className="form-group">
              <label className="form-label" htmlFor="sm-review-decision">Review outcome</label>
              <select id="sm-review-decision" className="form-select" value={decision} onChange={event => setDecision(event.target.value)}>
                <option value="Reviewed">Reviewed</option>
                <option value="Shortlisted">Shortlisted</option>
                <option value="Declined">Declined</option>
              </select>
            </div>
            <div className="form-group">
              <label className="form-label" htmlFor="sm-review-note">Review note</label>
              <textarea id="sm-review-note" className={`form-textarea${error ? ' mc-input-error' : ''}`} value={note} maxLength={500} onChange={event => { setNote(event.target.value); setError(''); }} placeholder="Add a concise reason for this review outcome…" aria-invalid={!!error} />
              {error && <div className="mc-field-error" role="alert">{error}</div>}
            </div>
            <p className="sm-demo-note">This review is held in the current demo session only.</p>
          </div>
          <div className="modal-footer">
            <button type="button" className="btn-secondary" onClick={onClose}>Cancel</button>
            <button type="submit" className="btn-primary"><Icon name="Check" size={14} color="#fff" /> Save Review</button>
          </div>
        </form>
      </div>
    </div>
  );
}

function StartupMatchesPage({ matches, setMatches, challenges, onOpenChallenge }) {
  const [search, setSearch] = useState('');
  const [scoreFilter, setScoreFilter] = useState('All');
  const [domainFilter, setDomainFilter] = useState('All');
  const [statusFilter, setStatusFilter] = useState('All');
  const [dialog, setDialog] = useState(null);
  const [notice, setNotice] = useState('');
  const challengeById = id => challenges.find(challenge => challenge.id === id);
  const domains = [...new Set(matches.map(match => match.domain))].sort();
  const statuses = ['Pending Review','Reviewed','Shortlisted','Proposal Submitted','Declined'];
  const filtered = matches.filter(match => {
    const term = search.trim().toLowerCase();
    const challenge = challengeById(match.challengeId);
    const searchText = `${match.name} ${match.description} ${match.domain} ${match.technologies.join(' ')} ${challenge?.title || ''}`.toLowerCase();
    const scoreMatches = scoreFilter === 'All'
      || (scoreFilter === '85+' && match.matchScore >= 85)
      || (scoreFilter === '70-84' && match.matchScore >= 70 && match.matchScore < 85)
      || (scoreFilter === 'Under 70' && match.matchScore < 70);
    return (!term || searchText.includes(term))
      && scoreMatches
      && (domainFilter === 'All' || match.domain === domainFilter)
      && (statusFilter === 'All' || match.status === statusFilter);
  });
  const summaries = [
    { label:'Total Matches', value:matches.length, icon:'Users', bg:'#EBF2FF', color:'#173C70' },
    { label:'High Matches', value:matches.filter(match => match.matchScore >= 85).length, icon:'TrendingUp', bg:'#E6F7F5', color:'#0F9D8A' },
    { label:'Shortlisted', value:matches.filter(match => match.status === 'Shortlisted').length, icon:'BookmarkCheck', bg:'#F3EEFF', color:'#6d28d9' },
    { label:'Pending Review', value:matches.filter(match => match.status === 'Pending Review').length, icon:'ClipboardList', bg:'#FFF4E5', color:'#b45309' },
  ];

  function showFeedback(message) {
    setNotice(message);
    setDialog(null);
  }

  function toggleShortlist(match) {
    const nextStatus = match.status === 'Shortlisted' ? (match.statusBeforeShortlist || 'Reviewed') : 'Shortlisted';
    setMatches(previous => previous.map(item => item.id === match.id
      ? { ...item, status:nextStatus, statusBeforeShortlist:nextStatus === 'Shortlisted' ? item.status : undefined }
      : item));
    showFeedback(nextStatus === 'Shortlisted' ? `${match.name} added to the shortlist.` : `${match.name} removed from the shortlist.`);
  }

  function saveReview(match, review) {
    setMatches(previous => previous.map(item => item.id === match.id
      ? { ...item, ...review, statusBeforeShortlist:review.status === 'Shortlisted' ? item.status : undefined }
      : item));
    showFeedback(`${match.name} marked ${review.status.toLowerCase()}.`);
  }

  function removeMatch(match) {
    setMatches(previous => previous.filter(item => item.id !== match.id));
    showFeedback(`${match.name} removed from the current match list.`);
  }

  function resetFilters() {
    setSearch('');
    setScoreFilter('All');
    setDomainFilter('All');
    setStatusFilter('All');
  }

  return (
    <div className="page-content fade-in startup-matches-page">
      <div className="welcome-bar">
        <div>
          <h1 className="mc-page-title">Startup Matches</h1>
          <p className="mc-page-subtitle">Review startups ranked against your challenge needs, technologies and domain requirements.</p>
        </div>
      </div>
      {notice && <div className="mc-notice" role="status"><Icon name="CheckCircle" size={16} color="#0F9D8A" />{notice}</div>}

      <div className="summary-grid sm-summary-grid">
        {summaries.map(card => <div key={card.label} className="summary-card"><div className="summary-icon" style={{ background:card.bg }}><Icon name={card.icon} size={20} color={card.color} /></div><div><div className="summary-value">{card.value}</div><div className="summary-label">{card.label}</div></div></div>)}
      </div>

      <section className="card sm-results-card">
        <div className="card-header sm-results-header">
          <div><div className="card-title">Matched Startups</div><div className="mc-result-count">Showing {filtered.length} of {matches.length} matches</div></div>
          <div className="sm-filter-toolbar">
            <div className="search-wrap sm-search"><span className="search-icon"><Icon name="Search" size={14} color="#667085" /></span><input type="search" placeholder="Search name or technology…" aria-label="Search startup name or technology" value={search} onChange={event => setSearch(event.target.value)} /></div>
            <select className="form-select sm-filter" aria-label="Filter by match score" value={scoreFilter} onChange={event => setScoreFilter(event.target.value)}><option value="All">All match scores</option><option value="85+">85% and above</option><option value="70-84">70% to 84%</option><option value="Under 70">Below 70%</option></select>
            <select className="form-select sm-filter" aria-label="Filter by domain" value={domainFilter} onChange={event => setDomainFilter(event.target.value)}><option value="All">All domains</option>{domains.map(domain => <option key={domain} value={domain}>{domain}</option>)}</select>
            <select className="form-select sm-filter" aria-label="Filter by review status" value={statusFilter} onChange={event => setStatusFilter(event.target.value)}><option value="All">All review statuses</option>{statuses.map(status => <option key={status} value={status}>{status}</option>)}</select>
          </div>
        </div>

        {filtered.length ? <div className="sm-match-grid">
          {filtered.map(match => {
            const challenge = challengeById(match.challengeId);
            return <article className="sm-match-card" key={match.id}>
              <div className="sm-card-heading">
                <div className="sm-company">
                  <div className="startup-avatar" style={{ background:match.color }}>{match.initials}</div>
                  <div className="sm-company-copy"><h2>{match.name}</h2><span>{match.domain}</span></div>
                </div>
                <span className={`sm-score-badge sm-score-${matchScoreTone(match.matchScore)}`}>{match.matchScore}% match</span>
              </div>
              <p className="sm-card-description">{match.description}</p>
              <div className="sm-card-meta"><span>Proposal status</span><span className={`badge ${matchStatusBadge(match.status)}`}>{match.status}</span></div>
              <div className="sm-tech-label">Technologies</div>
              <div className="tag-list sm-tech-list">{match.technologies.map(technology => <span className="tag" key={technology}>{technology}</span>)}</div>
              {challenge && <div className="sm-challenge-link"><span>Matched challenge</span><button className="view-link" onClick={() => onOpenChallenge(challenge.id)}>{challenge.title}<Icon name="ArrowUpRight" size={13} /></button></div>}
              <div className="sm-card-actions">
                <button className="btn-secondary" onClick={() => setDialog({ type:'details', match })}><Icon name="Eye" size={14} /> Details</button>
                <button className="btn-secondary" onClick={() => setDialog({ type:'review', match })}><Icon name="ClipboardCheck" size={14} /> Review</button>
                <button className={`btn-secondary${match.status === 'Shortlisted' ? ' sm-shortlisted-action' : ''}`} onClick={() => toggleShortlist(match)}><Icon name={match.status === 'Shortlisted' ? 'BookmarkCheck' : 'BookmarkPlus'} size={14} />{match.status === 'Shortlisted' ? 'Shortlisted' : 'Shortlist'}</button>
                <button className="sm-remove-action" onClick={() => setDialog({ type:'remove', match })}><Icon name="Trash2" size={14} /> Remove</button>
              </div>
            </article>;
          })}
        </div> : <div className="mc-empty-state"><div className="mc-empty-icon"><Icon name="SearchX" size={22} color="#173C70" /></div><h2>No matching startups</h2><p>Adjust your search or filters to see other startup matches.</p><button className="btn-secondary" onClick={resetFilters}>Clear filters</button></div>}
      </section>

      {dialog?.type === 'details' && <StartupMatchDetailsModal match={dialog.match} challenge={challengeById(dialog.match.challengeId)} onClose={() => setDialog(null)} onReview={match => setDialog({ type:'review', match })} onShortlist={toggleShortlist} onOpenChallenge={id => { setDialog(null); onOpenChallenge(id); }} />}
      {dialog?.type === 'review' && <StartupMatchReviewModal match={dialog.match} onClose={() => setDialog(null)} onSave={saveReview} />}
      {dialog?.type === 'remove' && <div className="modal-overlay sm-modal" onClick={event => { if (event.target === event.currentTarget) setDialog(null); }}><div className="modal-box sm-confirm-box" role="dialog" aria-modal="true" aria-labelledby="sm-remove-heading"><div className="modal-header"><span className="modal-title" id="sm-remove-heading">Remove startup match?</span><button className="icon-btn" onClick={() => setDialog(null)} aria-label="Close confirmation"><Icon name="X" size={16} /></button></div><div className="modal-body"><p className="sm-remove-copy">Remove <strong>{dialog.match.name}</strong> from this demo match list? This can’t be undone during this session.</p><p className="sm-demo-note">This only changes the current frontend demo state.</p></div><div className="modal-footer"><button className="btn-secondary" onClick={() => setDialog(null)}>Keep Match</button><button className="sm-confirm-remove" onClick={() => removeMatch(dialog.match)}><Icon name="Trash2" size={14} /> Remove Match</button></div></div></div>}
    </div>
  );
}

function proposalStatusBadge(status) {
  if (status === 'Pending Review') return 'badge-amber';
  if (status === 'Proposal Submitted') return 'badge-purple';
  if (status === 'Accepted') return 'badge-teal';
  if (status === 'Rejected') return 'pr-status-rejected';
  return 'pr-status-revisions';
}

function formatProposalDate(value) {
  if (!value) return 'Not set';
  return new Date(`${value}T00:00:00`).toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' });
}

function ProposalReviewModal({ proposal, onClose, onSave }) {
  const [decision, setDecision] = useState('Accepted');
  const [note, setNote] = useState('');
  const [error, setError] = useState('');
  const [confirming, setConfirming] = useState(false);
  useEffect(() => {
    const onKey = event => { if (event.key === 'Escape') onClose(); };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [onClose]);

  function continueToConfirm(event) {
    event.preventDefault();
    if (decision !== 'Accepted' && note.trim().length < 10) {
      setError('Add a review note of at least 10 characters for this decision.');
      return;
    }
    setError('');
    setConfirming(true);
  }

  return (
    <div className="modal-overlay pr-modal" onClick={event => { if (event.target === event.currentTarget) onClose(); }}>
      <div className="modal-box" role="dialog" aria-modal="true" aria-labelledby="pr-review-title">
        {confirming ? (
          <>
            <div className="modal-header"><span className="modal-title" id="pr-review-title">Confirm proposal decision</span><button className="icon-btn" onClick={onClose} aria-label="Close review confirmation"><Icon name="X" size={16} /></button></div>
            <div className="modal-body"><p className="pr-confirm-copy">Mark <strong>{proposal.title}</strong> as <span className={`badge ${proposalStatusBadge(decision)}`}>{decision}</span>?</p>{note.trim() && <p className="pr-confirm-note">Review note: {note.trim()}</p>}<p className="sm-demo-note">This changes the current frontend demo state only.</p></div>
            <div className="modal-footer"><button className="btn-secondary" onClick={() => setConfirming(false)}>Back to Review</button><button className="btn-primary" onClick={() => onSave(proposal, { status:decision, reviewNote:note.trim() })}><Icon name="Check" size={14} color="#fff" /> Confirm Decision</button></div>
          </>
        ) : (
          <form onSubmit={continueToConfirm} noValidate>
            <div className="modal-header"><span className="modal-title" id="pr-review-title">Review proposal</span><button type="button" className="icon-btn" onClick={onClose} aria-label="Close proposal review"><Icon name="X" size={16} /></button></div>
            <div className="modal-body">
              <p className="pr-reviewing-title">{proposal.title}</p>
              <div className="form-group"><label className="form-label" htmlFor="pr-decision">Decision</label><select id="pr-decision" className="form-select" value={decision} onChange={event => { setDecision(event.target.value); setError(''); }}><option value="Accepted">Accept proposal</option><option value="Rejected">Reject proposal</option><option value="Revisions Requested">Request revisions</option></select></div>
              <div className="form-group"><label className="form-label" htmlFor="pr-review-note">Review note {decision !== 'Accepted' && <span className="post-required">Required</span>}</label><textarea id="pr-review-note" className={`form-textarea${error ? ' mc-input-error' : ''}`} value={note} onChange={event => { setNote(event.target.value); setError(''); }} maxLength={500} placeholder="Summarize the decision and any next steps…" aria-invalid={!!error} />{error && <div className="mc-field-error" role="alert">{error}</div>}</div>
              <p className="sm-demo-note">You will confirm this decision before it is applied.</p>
            </div>
            <div className="modal-footer"><button type="button" className="btn-secondary" onClick={onClose}>Cancel</button><button type="submit" className="btn-primary"><Icon name="ArrowRight" size={14} color="#fff" /> Continue</button></div>
          </form>
        )}
      </div>
    </div>
  );
}

function ProposalsPage({ proposals, setProposals, challenges, onOpenChallenge }) {
  const [search, setSearch] = useState('');
  const [statusFilter, setStatusFilter] = useState('All');
  const [challengeFilter, setChallengeFilter] = useState('All');
  const [dialog, setDialog] = useState(null);
  const [notice, setNotice] = useState('');
  const challengeById = id => challenges.find(challenge => challenge.id === id);
  const startupById = id => INITIAL_GOV_MATCHES.find(startup => startup.id === id);
  const challengeOptions = [...new Map(proposals.map(proposal => {
    const challenge = challengeById(proposal.challengeId);
    return challenge ? [challenge.id, challenge.title] : null;
  }).filter(Boolean))];
  const filtered = proposals.filter(proposal => {
    const startup = startupById(proposal.startupId);
    const challenge = challengeById(proposal.challengeId);
    const term = search.trim().toLowerCase();
    const matchesSearch = !term || `${proposal.title} ${startup?.name || proposal.startupName || ''}`.toLowerCase().includes(term);
    return matchesSearch
      && (statusFilter === 'All' || proposal.status === statusFilter)
      && (challengeFilter === 'All' || String(proposal.challengeId) === challengeFilter);
  });
  const summaryCards = [
    { label:'Total Proposals', value:proposals.length, icon:'Files', bg:'#EBF2FF', color:'#173C70' },
    { label:'Pending Review', value:proposals.filter(proposal => proposal.status === 'Pending Review').length, icon:'ClipboardList', bg:'#FFF4E5', color:'#b45309' },
    { label:'Accepted', value:proposals.filter(proposal => proposal.status === 'Accepted').length, icon:'CheckCircle', bg:'#E6F7F5', color:'#0F9D8A' },
    { label:'Rejected', value:proposals.filter(proposal => proposal.status === 'Rejected').length, icon:'XCircle', bg:'#FEE4E2', color:'#b42318' },
  ];

  function saveReview(proposal, review) {
    setProposals(previous => previous.map(item => item.id === proposal.id ? { ...item, ...review } : item));

    setStatusFilter('All');

      <div className="welcome-bar">
        <div><h1 className="mc-page-title">Proposals</h1><p className="mc-page-subtitle">Review startup solutions submitted for your department’s challenges.</p></div>
      </div>
      {notice && <div className="mc-notice" role="status"><Icon name="CheckCircle" size={16} color="#0F9D8A" />{notice} <span className="pr-demo-caption">Demo session only.</span></div>}

      <div className="summary-grid pr-summary-grid">

        <div className="card-header pr-list-header">
          <div><div className="card-title">Submitted Proposals</div><div className="mc-result-count">Showing {filtered.length} of {proposals.length} proposals</div></div>
          <div className="pr-toolbar">
            <div className="search-wrap pr-search"><span className="search-icon"><Icon name="Search" size={14} color="#667085" /></span><input type="search" aria-label="Search startup or proposal" placeholder="Search startup or proposal…" value={search} onChange={event => setSearch(event.target.value)} /></div>
            <select className="form-select pr-filter" aria-label="Filter proposals by status" value={statusFilter} onChange={event => setStatusFilter(event.target.value)}><option value="All">All statuses</option>{['Pending Review','Accepted','Rejected','Revisions Requested'].map(status => <option key={status} value={status}>{status}</option>)}</select>
            <select className="form-select pr-filter" aria-label="Filter proposals by challenge" value={challengeFilter} onChange={event => setChallengeFilter(event.target.value)}><option value="All">All challenges</option>{challengeOptions.map(([id,title]) => <option key={id} value={id}>{title}</option>)}</select>

        {filtered.length ? <div className="table-wrap pr-table-wrap">

              const startup = startupById(proposal.startupId);

                <td data-label="Startup"><span className="pr-startup-name"><span className="startup-avatar" style={{ background:startup?.color || '#173C70' }}>{startup?.initials || 'ST'}</span>{startup?.name || proposal.startupName}</span></td>
                <td data-label="Related challenge">{challenge?.title || 'Challenge unavailable'}</td>
                <td data-label="Submitted">{formatProposalDate(proposal.submissionDate)}</td>
                <td data-label="Status"><span className={`badge ${proposalStatusBadge(proposal.status)}`}>{proposal.status}</span></td>

      {dialog?.type === 'details' && <ProposalDetailsModal proposal={dialog.proposal} startup={startupById(dialog.proposal.startupId)} challenge={challengeById(dialog.proposal.challengeId)} onClose={() => setDialog(null)} onReview={proposal => setDialog({ type:'review', proposal })} onOpenChallenge={id => { setDialog(null); onOpenChallenge(id); }} />}
      {dialog?.type === 'review' && <ProposalReviewModal proposal={dialog.proposal} onClose={() => setDialog(null)} onSave={saveReview} />}
    </div>
  );
}

function evaluationStatusBadge(status) {
  if (status === 'Completed') return 'badge-teal';
  if (status === 'Flagged') return 'ev-status-flagged';
  if (status === 'In Progress') return 'badge-blue';
  return 'badge-amber';
}

function evaluationScore(evaluation) {
  const scores = EVALUATION_CRITERIA.map(criterion => Number(evaluation.scores?.[criterion.id])).filter(score => Number.isInteger(score) && score >= 1 && score <= 5);
  return scores.length ? `${(scores.reduce((total, score) => total + score, 0) / scores.length).toFixed(1)}/5` : '—';
}

function EvaluationDetailsModal({ proposal, evaluation, startup, challenge, onClose, onEvaluate, onOpenChallenge }) {
  useEffect(() => {
    const onKey = event => { if (event.key === 'Escape') onClose(); };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [onClose]);

  return (
    <div className="modal-overlay ev-modal" onClick={event => { if (event.target === event.currentTarget) onClose(); }}>

          <div className="ev-detail-heading"><div><h2 id="ev-detail-title">{proposal.title}</h2><span>{startup?.name || 'Startup applicant'} · submitted {formatProposalDate(proposal.submissionDate)}</span></div><span className={`badge ${evaluationStatusBadge(evaluation.status)}`}>{evaluation.status}</span></div>

function EvaluationEditorModal({ proposal, evaluation, onClose, onSave }) {
  const [scores, setScores] = useState(() => ({ ...(evaluation.scores || {}) }));
  const [comments, setComments] = useState(evaluation.comments || '');
  const [recommendation, setRecommendation] = useState(evaluation.recommendation || '');
  const [flagged, setFlagged] = useState(evaluation.status === 'Flagged');
  const [errors, setErrors] = useState({});
  const [confirming, setConfirming] = useState(false);
  useEffect(() => {
    const onKey = event => { if (event.key === 'Escape') onClose(); };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [onClose]);

  function saveDraft() {
    if (!EVALUATION_CRITERIA.some(criterion => scores[criterion.id])) {
      setErrors({ draft:'Enter at least one criterion score before saving a draft.' });
      return;
    }
    onSave(proposal.id, { scores, comments:comments.trim(), recommendation, status:flagged ? 'Flagged' : 'In Progress' }, false);
  }

  function beginSubmission(event) {
    event.preventDefault();
    const nextErrors = {};
    EVALUATION_CRITERIA.forEach(criterion => {
      if (!scores[criterion.id]) nextErrors[criterion.id] = 'Select a score from 1 to 5.';
    });
    if (comments.trim().length < 20) nextErrors.comments = 'Add at least 20 characters of reviewer comments.';
    if (!recommendation) nextErrors.recommendation = 'Select a final recommendation.';
    setErrors(nextErrors);
    if (Object.keys(nextErrors).length) return;
    setConfirming(true);
  }

  function confirmSubmission() {
    onSave(proposal.id, { scores, comments:comments.trim(), recommendation, status:'Completed' }, true);
  }

  return (
    <div className="modal-overlay ev-modal" onClick={event => { if (event.target === event.currentTarget) onClose(); }}>
      <div className="modal-box" role="dialog" aria-modal="true" aria-labelledby="ev-editor-title">
        {confirming ? (
          <>
            <div className="modal-header"><span className="modal-title" id="ev-editor-title">Confirm final evaluation</span><button className="icon-btn" onClick={onClose} aria-label="Close confirmation"><Icon name="X" size={16} /></button></div>
            <div className="modal-body"><p className="ev-confirm-text">Submit the evaluation for <strong>{proposal.title}</strong> with the recommendation <strong>{recommendation}</strong>?</p><p className="sm-demo-note">This finalizes the evaluation in this frontend demo session only.</p></div>
            <div className="modal-footer"><button className="btn-secondary" onClick={() => setConfirming(false)}>Back to Evaluation</button><button className="btn-primary" onClick={confirmSubmission}><Icon name="Check" size={14} color="#fff" /> Confirm Submission</button></div>
          </>
        ) : (
          <form onSubmit={beginSubmission} noValidate>
            <div className="modal-header"><div><span className="modal-title" id="ev-editor-title">Evaluate Proposal</span><span className="ev-editor-subtitle">{proposal.title}</span></div><button type="button" className="icon-btn" onClick={onClose} aria-label="Close evaluation editor"><Icon name="X" size={16} /></button></div>
            <div className="modal-body">
              <p className="ev-score-instruction">Rate each criterion from 1 (needs work) to 5 (excellent).</p>
              <div className="ev-criteria-list">{EVALUATION_CRITERIA.map(criterion => <div className="ev-criterion" key={criterion.id}><label className="form-label" htmlFor={`ev-score-${criterion.id}`}>{criterion.label}</label><select id={`ev-score-${criterion.id}`} className={`form-select${errors[criterion.id] ? ' mc-input-error' : ''}`} value={scores[criterion.id] || ''} onChange={event => { setScores(previous => ({ ...previous, [criterion.id]:event.target.value ? Number(event.target.value) : '' })); setErrors(previous => ({ ...previous, [criterion.id]:'', draft:'' })); }}><option value="">Select score</option>{[1,2,3,4,5].map(score => <option value={score} key={score}>{score} / 5</option>)}</select>{errors[criterion.id] && <span className="mc-field-error" role="alert">{errors[criterion.id]}</span>}</div>)}</div>
              <div className="form-group"><label className="form-label" htmlFor="ev-comments">Reviewer comments</label><textarea id="ev-comments" className={`form-textarea${errors.comments ? ' mc-input-error' : ''}`} value={comments} onChange={event => { setComments(event.target.value); setErrors(previous => ({ ...previous, comments:'' })); }} maxLength={1000} placeholder="Summarize strengths, risks, and any clarification needed…" /><div className="ev-character-count">{comments.length}/1000</div>{errors.comments && <div className="mc-field-error" role="alert">{errors.comments}</div>}</div>
              <div className="form-group"><label className="form-label" htmlFor="ev-recommendation">Final recommendation</label><select id="ev-recommendation" className={`form-select${errors.recommendation ? ' mc-input-error' : ''}`} value={recommendation} onChange={event => { setRecommendation(event.target.value); setErrors(previous => ({ ...previous, recommendation:'' })); }}><option value="">Select recommendation</option>{['Accept','Request Revisions','Reject'].map(option => <option key={option} value={option}>{option}</option>)}</select>{errors.recommendation && <div className="mc-field-error" role="alert">{errors.recommendation}</div>}</div>
              <label className="ev-flag-option"><input type="checkbox" checked={flagged} onChange={event => setFlagged(event.target.checked)} /><span>Flag for additional review</span></label>
              {errors.draft && <div className="mc-field-error" role="alert">{errors.draft}</div>}
              <p className="sm-demo-note">Scores and comments are held in the current frontend session only.</p>
            </div>
            <div className="modal-footer ev-editor-footer"><button type="button" className="btn-secondary" onClick={saveDraft}>Save Draft</button><button type="submit" className="btn-primary"><Icon name="Send" size={14} color="#fff" /> Submit Evaluation</button></div>
          </form>
        )}
      </div>
    </div>
  );
}

function EvaluationPage({ proposals, evaluations, setEvaluations, startups, challenges, onOpenChallenge }) {
  const [search, setSearch] = useState('');
  const [statusFilter, setStatusFilter] = useState('All');
  const [challengeFilter, setChallengeFilter] = useState('All');
  const [dialog, setDialog] = useState(null);
  const [notice, setNotice] = useState('');
  const proposalById = id => proposals.find(proposal => proposal.id === id);
  const startupById = id => startups.find(startup => startup.id === id);
  const challengeById = id => challenges.find(challenge => challenge.id === id);
  const challengeOptions = [...new Map(proposals.map(proposal => {
    const challenge = challengeById(proposal.challengeId);
    return challenge ? [challenge.id, challenge.title] : null;
  }).filter(Boolean))];
  const rows = evaluations.map(evaluation => ({ evaluation, proposal:proposalById(evaluation.proposalId) })).filter(row => row.proposal);
  const filtered = rows.filter(({ evaluation, proposal }) => {
    const startup = startupById(proposal.startupId);
    const challenge = challengeById(proposal.challengeId);
    const term = search.trim().toLowerCase();
    const text = `${startup?.name || proposal.startupName || ''} ${challenge?.title || ''} ${proposal.title}`.toLowerCase();
    return (!term || text.includes(term))
      && (statusFilter === 'All' || evaluation.status === statusFilter)
      && (challengeFilter === 'All' || String(proposal.challengeId) === challengeFilter);
  });
  const summaries = [
    { label:'Total Evaluations', value:rows.length, icon:'ClipboardCheck', bg:'#EBF2FF', color:'#173C70' },
    { label:'Pending', value:rows.filter(row => ['Pending','In Progress'].includes(row.evaluation.status)).length, icon:'Clock3', bg:'#FFF4E5', color:'#b45309' },
    { label:'Completed', value:rows.filter(row => row.evaluation.status === 'Completed').length, icon:'CheckCircle', bg:'#E6F7F5', color:'#0F9D8A' },
    { label:'Flagged', value:rows.filter(row => row.evaluation.status === 'Flagged').length, icon:'Flag', bg:'#FEE4E2', color:'#b42318' },
  ];

  function saveEvaluation(proposalId, update, final) {
    setEvaluations(previous => previous.map(evaluation => evaluation.proposalId === proposalId ? { ...evaluation, ...update } : evaluation));
    const proposal = proposalById(proposalId);
    setNotice(final ? `Evaluation submitted for ${proposal?.title || 'proposal'}.` : `Evaluation draft saved for ${proposal?.title || 'proposal'}.`);
    setDialog(null);
  }

  function resetFilters() {
    setSearch('');
    setStatusFilter('All');
    setChallengeFilter('All');
  }

  return (
    <div className="page-content evaluation-page">
      <div className="welcome-bar"><div><h1 className="mc-page-title">Evaluation</h1><p className="mc-page-subtitle">Score startup proposals against consistent criteria and record a clear recommendation.</p></div></div>
      {notice && <div className="mc-notice" role="status"><Icon name="CheckCircle" size={16} color="#0F9D8A" />{notice}<span className="ev-demo-caption">Demo session only.</span></div>}

      <div className="summary-grid ev-summary-grid">{summaries.map(card => <div key={card.label} className="summary-card"><div className="summary-icon" style={{ background:card.bg }}><Icon name={card.icon} size={20} color={card.color} /></div><div><div className="summary-value">{card.value}</div><div className="summary-label">{card.label}</div></div></div>)}</div>

      <section className="card ev-list-card">
        <div className="card-header ev-list-header"><div><div className="card-title">Submissions for Evaluation</div><div className="mc-result-count">Showing {filtered.length} of {rows.length} evaluations</div></div><div className="ev-toolbar"><div className="search-wrap ev-search"><span className="search-icon"><Icon name="Search" size={14} color="#667085" /></span><input type="search" aria-label="Search startup or challenge" placeholder="Search startup or challenge…" value={search} onChange={event => setSearch(event.target.value)} /></div><select className="form-select ev-filter" aria-label="Filter evaluations by status" value={statusFilter} onChange={event => setStatusFilter(event.target.value)}><option value="All">All statuses</option>{['Pending','In Progress','Completed','Flagged'].map(status => <option value={status} key={status}>{status}</option>)}</select><select className="form-select ev-filter" aria-label="Filter evaluations by challenge" value={challengeFilter} onChange={event => setChallengeFilter(event.target.value)}><option value="All">All challenges</option>{challengeOptions.map(([id,title]) => <option value={id} key={id}>{title}</option>)}</select></div></div>
        {filtered.length ? <div className="table-wrap ev-table-wrap"><table className="ev-table"><thead><tr>{['Startup','Related challenge','Submitted','Evaluation status','Score','Actions'].map(label => <th key={label}>{label}</th>)}</tr></thead><tbody>{filtered.map(({ evaluation, proposal }) => {const startup = startupById(proposal.startupId); const challenge = challengeById(proposal.challengeId);return <tr key={proposal.id}><td className="ev-startup-cell" data-label="Startup"><span className="ev-startup-name"><span className="startup-avatar" style={{ background:startup?.color || '#173C70' }}>{startup?.initials || 'ST'}</span>{startup?.name || proposal.startupName}</span></td><td data-label="Related challenge">{challenge?.title || 'Challenge unavailable'}</td><td data-label="Submitted">{formatProposalDate(proposal.submissionDate)}</td><td data-label="Evaluation status"><span className={`badge ${evaluationStatusBadge(evaluation.status)}`}>{evaluation.status}</span></td><td data-label="Score" className="ev-score-cell">{evaluationScore(evaluation)}</td><td className="ev-actions-cell" data-label="Actions"><div className="ev-row-actions"><button className="btn-secondary ev-action-btn" onClick={() => setDialog({ type:'details', proposal, evaluation })}><Icon name="Eye" size={14} /> Details</button><button className="btn-primary ev-action-btn" onClick={() => setDialog({ type:'edit', proposal, evaluation })}><Icon name="ClipboardCheck" size={14} color="#fff" /> Evaluate</button></div></td></tr>;})}</tbody></table></div> : <div className="mc-empty-state"><div className="mc-empty-icon"><Icon name="SearchX" size={22} color="#173C70" /></div><h2>No evaluations found</h2><p>Try another startup, challenge, or status filter.</p><button className="btn-secondary" onClick={resetFilters}>Clear filters</button></div>}
      </section>

      {dialog?.type === 'details' && <EvaluationDetailsModal proposal={dialog.proposal} evaluation={dialog.evaluation} startup={startupById(dialog.proposal.startupId)} challenge={challengeById(dialog.proposal.challengeId)} onClose={() => setDialog(null)} onEvaluate={(proposal, evaluation) => setDialog({ type:'edit', proposal, evaluation })} onOpenChallenge={id => { setDialog(null); onOpenChallenge(id); }} />}
      {dialog?.type === 'edit' && <EvaluationEditorModal key={dialog.proposal.id} proposal={dialog.proposal} evaluation={dialog.evaluation} onClose={() => setDialog(null)} onSave={saveEvaluation} />}
    </div>
  );
}

function pilotStatusBadge(status) {
  if (status === 'Completed') return 'badge-teal';
  if (status === 'Delayed') return 'pt-status-delayed';
  if (status === 'In Progress') return 'badge-blue';
  return 'badge-amber';
}

function PilotEditorModal({ pilot, onClose, onSave }) {
  const [progress, setProgress] = useState(String(pilot.progress));
  const [status, setStatus] = useState(pilot.status);
  const [milestones, setMilestones] = useState(() => pilot.milestones.map(milestone => ({ ...milestone })));
  const [notes, setNotes] = useState(pilot.notes || '');
  const [errors, setErrors] = useState({});
  const [confirming, setConfirming] = useState(false);

  useEffect(() => {
    const onKey = event => { if (event.key === 'Escape') onClose(); };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [onClose]);

  function updates() {
    return { progress:Number(progress), status, milestones, notes:notes.trim() };
  }

  function save(event) {
    event.preventDefault();
    const nextErrors = {};
    const progressValue = Number(progress);
    if (progress === '' || !Number.isInteger(progressValue) || progressValue < 0 || progressValue > 100) nextErrors.progress = 'Enter a whole-number progress value from 0 to 100.';
    if (notes.trim() && notes.trim().length < 10) nextErrors.notes = 'Add at least 10 characters or leave notes blank.';
    if (status === 'Completed') {
      if (progressValue !== 100) nextErrors.completion = 'Set progress to 100% before completing the pilot.';
      if (milestones.some(milestone => milestone.status !== 'Completed')) nextErrors.completion = 'Mark every milestone complete before completing the pilot.';
    }
    setErrors(nextErrors);
    if (Object.keys(nextErrors).length) return;
    if (status === 'Completed' && pilot.status !== 'Completed') {
      setConfirming(true);
      return;
    }
    onSave(pilot.id, updates(), false);
  }

  return (
    <div className="modal-overlay pt-modal" onClick={event => { if (event.target === event.currentTarget) onClose(); }}>
      <div className="modal-box" role="dialog" aria-modal="true" aria-labelledby="pt-editor-title">
        {confirming ? (
          <>
            <div className="modal-header"><span className="modal-title" id="pt-editor-title">Confirm pilot completion</span><button className="icon-btn" onClick={onClose} aria-label="Close completion confirmation"><Icon name="X" size={16} /></button></div>
            <div className="modal-body"><p className="pt-confirm-text">Mark <strong>{pilot.name}</strong> as completed? This will update the pilot status in the current demo session.</p></div>
            <div className="modal-footer"><button className="btn-secondary" onClick={() => setConfirming(false)}>Back to Update</button><button className="btn-primary" onClick={() => onSave(pilot.id, updates(), true)}><Icon name="Check" size={14} color="#fff" /> Confirm Completion</button></div>
          </>
        ) : (
          <form onSubmit={save} noValidate>
            <div className="modal-header"><div><span className="modal-title" id="pt-editor-title">Update Pilot</span><span className="pt-editor-subtitle">{pilot.name}</span></div><button type="button" className="icon-btn" onClick={onClose} aria-label="Close pilot update"><Icon name="X" size={16} /></button></div>
            <div className="modal-body">
              <div className="pt-editor-grid">
                <div className="form-group"><label className="form-label" htmlFor="pt-progress">Progress (%)</label><input id="pt-progress" className={`form-input${errors.progress ? ' mc-input-error' : ''}`} type="number" min="0" max="100" step="1" value={progress} onChange={event => { setProgress(event.target.value); setErrors(previous => ({ ...previous, progress:'', completion:'' })); }} aria-invalid={!!errors.progress} />{errors.progress && <span className="mc-field-error" role="alert">{errors.progress}</span>}</div>
                <div className="form-group"><label className="form-label" htmlFor="pt-status">Pilot status</label><select id="pt-status" className="form-select" value={status} onChange={event => { setStatus(event.target.value); setErrors(previous => ({ ...previous, completion:'' })); }}><option>Planned</option><option>In Progress</option><option>Delayed</option><option>Completed</option></select></div>
              </div>
              {errors.completion && <div className="mc-field-error pt-completion-error" role="alert">{errors.completion}</div>}
              <div className="pt-editor-section"><h3>Milestones</h3>{milestones.map(milestone => <div className="pt-edit-milestone" key={milestone.id}><div><strong>{milestone.title}</strong><span>Due {formatProposalDate(milestone.dueDate)}</span></div><select className="form-select" aria-label={`Milestone status: ${milestone.title}`} value={milestone.status} onChange={event => setMilestones(previous => previous.map(item => item.id === milestone.id ? { ...item, status:event.target.value } : item))}><option>Planned</option><option>In Progress</option><option>Completed</option><option>Delayed</option></select></div>)}</div>
              <div className="form-group pt-notes-group"><label className="form-label" htmlFor="pt-notes">Pilot notes</label><textarea id="pt-notes" className={`form-textarea${errors.notes ? ' mc-input-error' : ''}`} maxLength={600} value={notes} onChange={event => { setNotes(event.target.value); setErrors(previous => ({ ...previous, notes:'' })); }} placeholder="Add a progress update or note for the department…" />{errors.notes && <span className="mc-field-error" role="alert">{errors.notes}</span>}<span className="pt-notes-count">{notes.length}/600</span></div>
              <p className="sm-demo-note">Updates remain in the current frontend session only.</p>
            </div>
            <div className="modal-footer"><button type="button" className="btn-secondary" onClick={onClose}>Cancel</button><button type="submit" className="btn-primary"><Icon name="Save" size={14} color="#fff" /> Save Updates</button></div>
          </form>
        )}
      </div>
    </div>
  );
}

function PilotTrackingPage({ pilots, setPilots, challenges, startups, onOpenChallenge }) {
  const [search, setSearch] = useState('');
  const [statusFilter, setStatusFilter] = useState('All');
  const [departmentFilter, setDepartmentFilter] = useState('All');
  const [endByDate, setEndByDate] = useState('');
  const [dialog, setDialog] = useState(null);
  const [notice, setNotice] = useState('');
  const challengeById = id => challenges.find(challenge => challenge.id === id);
  const startupById = id => startups.find(startup => startup.id === id);
  const departments = [...new Set(pilots.map(pilot => pilot.department))].sort();
  const filtered = pilots.filter(pilot => {
    const challenge = challengeById(pilot.challengeId);
    const startup = startupById(pilot.startupId);
    const term = search.trim().toLowerCase();
    const searchText = `${pilot.name} ${challenge?.title || ''} ${startup?.name || ''}`.toLowerCase();
    return (!term || searchText.includes(term))
      && (statusFilter === 'All' || pilot.status === statusFilter)
      && (departmentFilter === 'All' || pilot.department === departmentFilter)
      && (!endByDate || pilot.endDate <= endByDate);
  });
  const summaries = [
    { label:'Total Pilots', value:pilots.length, icon:'Rocket', bg:'#EBF2FF', color:'#173C70' },
    { label:'Planned', value:pilots.filter(pilot => pilot.status === 'Planned').length, icon:'CalendarDays', bg:'#FFF4E5', color:'#b45309' },
    { label:'In Progress', value:pilots.filter(pilot => pilot.status === 'In Progress').length, icon:'Activity', bg:'#E6F7F5', color:'#0F9D8A' },
    { label:'Completed', value:pilots.filter(pilot => pilot.status === 'Completed').length, icon:'CheckCircle', bg:'#EBF2FF', color:'#173C70' },
    { label:'Delayed', value:pilots.filter(pilot => pilot.status === 'Delayed').length, icon:'AlertTriangle', bg:'#FEE4E2', color:'#b42318' },
  ];

  function savePilot(pilotId, update, completed) {
    const pilot = pilots.find(item => item.id === pilotId);
    setPilots(previous => previous.map(item => item.id === pilotId ? { ...item, ...update } : item));
    setNotice(completed ? `${pilot?.name || 'Pilot'} marked completed.` : `Updates saved for ${pilot?.name || 'pilot'}.`);
    setDialog(null);
  }

  function resetFilters() {
    setSearch('');
    setStatusFilter('All');
    setDepartmentFilter('All');
    setEndByDate('');
  }

  return (
    <div className="page-content pilot-page">
      <div className="welcome-bar"><div><h1 className="mc-page-title">Pilot Tracking</h1><p className="mc-page-subtitle">Monitor delivery milestones, timelines, and outcomes across active pilots.</p></div></div>
      {notice && <div className="mc-notice" role="status"><Icon name="CheckCircle" size={16} color="#0F9D8A" />{notice}<span className="pt-demo-caption">Demo session only.</span></div>}

      <div className="summary-grid pt-summary-grid">{summaries.map(card => <div key={card.label} className="summary-card"><div className="summary-icon" style={{ background:card.bg }}><Icon name={card.icon} size={20} color={card.color} /></div><div><div className="summary-value">{card.value}</div><div className="summary-label">{card.label}</div></div></div>)}</div>

      <section className="card pt-list-card"><div className="card-header pt-list-header"><div><div className="card-title">Government Pilots</div><div className="mc-result-count">Showing {filtered.length} of {pilots.length} pilots</div></div><div className="pt-toolbar"><div className="search-wrap pt-search"><span className="search-icon"><Icon name="Search" size={14} color="#667085" /></span><input type="search" aria-label="Search pilot, challenge, or startup" placeholder="Search challenge or startup…" value={search} onChange={event => setSearch(event.target.value)} /></div><select className="form-select pt-filter" aria-label="Filter pilots by status" value={statusFilter} onChange={event => setStatusFilter(event.target.value)}><option value="All">All statuses</option>{['Planned','In Progress','Completed','Delayed'].map(status => <option key={status}>{status}</option>)}</select><select className="form-select pt-filter" aria-label="Filter pilots by department" value={departmentFilter} onChange={event => setDepartmentFilter(event.target.value)}><option value="All">All departments</option>{departments.map(department => <option key={department}>{department}</option>)}</select><label className="pt-date-filter"><span>End by</span><input type="date" aria-label="Filter pilots ending by date" value={endByDate} onChange={event => setEndByDate(event.target.value)} /></label></div></div>
        {filtered.length ? <div className="table-wrap pt-table-wrap"><table className="pt-table"><thead><tr>{['Pilot','Challenge','Startup','Department','Start date','End date','Progress','Status','Actions'].map(label => <th key={label}>{label}</th>)}</tr></thead><tbody>{filtered.map(pilot => {const challenge=challengeById(pilot.challengeId);const startup=startupById(pilot.startupId);return <tr key={pilot.id}><td className="pt-name-cell" data-label="Pilot">{pilot.name}</td><td data-label="Challenge">{challenge?.title || 'Challenge unavailable'}</td><td data-label="Startup">{startup?.name || 'Startup unavailable'}</td><td data-label="Department">{pilot.department}</td><td data-label="Start date">{formatProposalDate(pilot.startDate)}</td><td data-label="End date">{formatProposalDate(pilot.endDate)}</td><td className="pt-progress-cell" data-label="Progress"><div className="pt-progress-track"><span style={{ width:`${pilot.progress}%` }} /></div><strong>{pilot.progress}%</strong></td><td data-label="Status"><span className={`badge ${pilotStatusBadge(pilot.status)}`}>{pilot.status}</span></td><td className="pt-actions-cell" data-label="Actions"><div className="pt-row-actions"><button className="btn-secondary pt-action-btn" onClick={() => setDialog({ type:'details', pilot })}><Icon name="Eye" size={14} /> Details</button><button className="btn-primary pt-action-btn" onClick={() => setDialog({ type:'edit', pilot })}><Icon name="Pencil" size={14} color="#fff" /> Update</button></div></td></tr>;})}</tbody></table></div> : <div className="mc-empty-state"><div className="mc-empty-icon"><Icon name="SearchX" size={22} color="#173C70" /></div><h2>No pilots found</h2><p>Try another search, department, status, or end date.</p><button className="btn-secondary" onClick={resetFilters}>Clear filters</button></div>}
      </section>
      {dialog?.type === 'details' && <PilotDetailsModal pilot={dialog.pilot} startup={startupById(dialog.pilot.startupId)} challenge={challengeById(dialog.pilot.challengeId)} onClose={() => setDialog(null)} onEdit={pilot => setDialog({ type:'edit', pilot })} onOpenChallenge={id => { setDialog(null); onOpenChallenge(id); }} />}
      {dialog?.type === 'edit' && <PilotEditorModal key={dialog.pilot.id} pilot={dialog.pilot} onClose={() => setDialog(null)} onSave={savePilot} />}
    </div>
  );
}

function PerformanceDetailsModal({ challenge, proposals, evaluations, pilots, startups, onClose, onOpenChallenge }) {
  useEffect(() => {
    const onKey = event => { if (event.key === 'Escape') onClose(); };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [onClose]);

  const challengeProposals = proposals.filter(proposal => proposal.challengeId === challenge.id);
  const challengePilots = pilots.filter(pilot => pilot.challengeId === challenge.id);
  const proposalIds = new Set(challengeProposals.map(proposal => proposal.id));
  const challengeEvaluations = evaluations.filter(evaluation => proposalIds.has(evaluation.proposalId));
  const challengeStartups = [...new Set(challengeProposals.map(proposal => proposal.startupId))].map(id => startups.find(startup => startup.id === id)).filter(Boolean);
  const completedEvaluations = challengeEvaluations.filter(evaluation => evaluation.status === 'Completed').length;
  const acceptedProposals = challengeProposals.filter(proposal => proposal.status === 'Accepted').length;
  const progress = challengePilots.length ? Math.round(challengePilots.reduce((total, pilot) => total + pilot.progress, 0) / challengePilots.length) : null;

  return (
    <div className="modal-overlay pf-modal" onClick={event => { if (event.target === event.currentTarget) onClose(); }}>
      <div className="modal-box" role="dialog" aria-modal="true" aria-labelledby="performance-detail-title">
        <div className="modal-header"><span className="modal-title">Challenge performance</span><button className="icon-btn" onClick={onClose} aria-label="Close performance details"><Icon name="X" size={16} /></button></div>
        <div className="modal-body">
          <div className="perf-detail-heading"><div><h2 id="performance-detail-title">{challenge.title}</h2><span>{challenge.category} · deadline {formatProposalDate(challenge.deadline)}</span></div><span className={`badge ${challengeStatusBadge(challenge.status)}`}>{challenge.status}</span></div>
          <div className="perf-detail-metrics"><div><span>Applications</span><strong>{challenge.applications}</strong></div><div><span>Participating startups</span><strong>{challengeStartups.length}</strong></div><div><span>Proposals</span><strong>{challengeProposals.length}</strong></div><div><span>Evaluation completion</span><strong>{challengeEvaluations.length ? `${Math.round(completedEvaluations / challengeEvaluations.length * 100)}%` : '—'}</strong></div></div>
          <section className="perf-detail-section"><h3>Challenge brief</h3><p>{challenge.description}</p></section>
          <section className="perf-detail-section"><h3>Pilot progress</h3>{challengePilots.length ? challengePilots.map(pilot => <div className="perf-pilot-detail" key={pilot.id}><div><strong>{pilot.name}</strong><span>{pilot.status} · {pilot.progress}%</span></div><div className="perf-bar-track"><span style={{ width:`${pilot.progress}%` }} /></div><div className="perf-pilot-dates">{formatProposalDate(pilot.startDate)} – {formatProposalDate(pilot.endDate)}</div>{pilot.milestones.map(milestone => <div className="perf-milestone-row" key={milestone.id}><span>{milestone.title}</span><span className={`badge ${pilotStatusBadge(milestone.status)}`}>{milestone.status}</span></div>)}</div>) : <p>No pilots are linked to this challenge yet.</p>}</section>
          <section className="perf-detail-section"><h3>Proposed outcomes <span>(unverified)</span></h3>{challengeProposals.length ? challengeProposals.map(proposal => <div className="perf-outcome" key={proposal.id}><strong>{startups.find(startup => startup.id === proposal.startupId)?.name || 'Startup proposal'}</strong><p>{proposal.expectedOutcomes}</p></div>) : <p>No proposal outcomes have been submitted.</p>}</section>
          <p className="perf-demo-note">All figures are calculated from frontend mock records. Proposed outcomes are not measured results.</p>
        </div>
        <div className="modal-footer"><button className="btn-secondary" onClick={onClose}>Close</button><button className="btn-primary" onClick={() => onOpenChallenge(challenge.id)}><Icon name="FileText" size={14} color="#fff" /> View Challenge</button></div>
      </div>
    </div>
  );
}

function PerformancePage({ challenges, matches, proposals, evaluations, pilots, onOpenChallenge }) {
  const [search, setSearch] = useState('');
  const [departmentFilter, setDepartmentFilter] = useState('All');
  const [statusFilter, setStatusFilter] = useState('All');
  const [dateFrom, setDateFrom] = useState('');
  const [dateTo, setDateTo] = useState('');
  const [selectedChallenge, setSelectedChallenge] = useState(null);

  const proposalsFor = challengeId => proposals.filter(proposal => proposal.challengeId === challengeId);
  const pilotsFor = challengeId => pilots.filter(pilot => pilot.challengeId === challengeId);
  const departmentsFor = challengeId => [...new Set(pilotsFor(challengeId).map(pilot => pilot.department))];
  const progressFor = challengeId => {
    const challengePilots = pilotsFor(challengeId);
    return challengePilots.length ? Math.round(challengePilots.reduce((total, pilot) => total + pilot.progress, 0) / challengePilots.length) : null;
  };
  const pilotStatusFor = challengeId => {
    const challengePilots = pilotsFor(challengeId);
    if (!challengePilots.length) return 'No Pilot';
    if (challengePilots.some(pilot => pilot.status === 'Delayed')) return 'Delayed';
    if (challengePilots.some(pilot => pilot.status === 'In Progress')) return 'In Progress';
    if (challengePilots.some(pilot => pilot.status === 'Planned')) return 'Planned';
    return 'Completed';
  };
  const rowData = challenges.map(challenge => {
    const challengeProposals = proposalsFor(challenge.id);
    const startupIds = [...new Set(challengeProposals.map(proposal => proposal.startupId))];
    return { challenge, proposalCount:challengeProposals.length, startupCount:startupIds.length, departments:departmentsFor(challenge.id), pilotStatus:pilotStatusFor(challenge.id), progress:progressFor(challenge.id) };
  });
  const departments = [...new Set(rowData.flatMap(row => row.departments))].sort();
  const term = search.trim().toLowerCase();
  const filtered = rowData.filter(({ challenge, departments:challengeDepartments }) => {
    const challengeProposals = proposalsFor(challenge.id);
    const proposalStartupNames = challengeProposals.map(proposal => matches.find(startup => startup.id === proposal.startupId)?.name || '');
    const matchStartupNames = matches.filter(startup => startup.challengeId === challenge.id).map(startup => startup.name);
    const searchableText = `${challenge.title} ${proposalStartupNames.join(' ')} ${matchStartupNames.join(' ')}`.toLowerCase();
    return (!term || searchableText.includes(term))
      && (statusFilter === 'All' || challenge.status === statusFilter)
      && (departmentFilter === 'All' ? true : challengeDepartments.includes(departmentFilter))
      && (!dateFrom || challenge.deadline >= dateFrom)
      && (!dateTo || challenge.deadline <= dateTo);
  });

  const activePilots = pilots.filter(pilot => ['In Progress','Delayed'].includes(pilot.status)).length;
  const completedPilots = pilots.filter(pilot => pilot.status === 'Completed').length;
  const overallProgress = pilots.length ? Math.round(pilots.reduce((total, pilot) => total + pilot.progress, 0) / pilots.length) : 0;
  const proposerIds = new Set(proposals.map(proposal => proposal.startupId));
  const metrics = [
    { label:'Startup participation', value:`${proposerIds.size}/${matches.length}`, percent:matches.length ? Math.round(proposerIds.size / matches.length * 100) : 0, formula:'Unique proposal submitters ÷ matched startups' },
    { label:'Proposal acceptance', value:`${proposals.length ? Math.round(proposals.filter(proposal => proposal.status === 'Accepted').length / proposals.length * 100) : 0}%`, percent:proposals.length ? Math.round(proposals.filter(proposal => proposal.status === 'Accepted').length / proposals.length * 100) : 0, formula:'Accepted proposals ÷ all proposals' },
    { label:'Evaluation completion', value:`${evaluations.length ? Math.round(evaluations.filter(evaluation => evaluation.status === 'Completed').length / evaluations.length * 100) : 0}%`, percent:evaluations.length ? Math.round(evaluations.filter(evaluation => evaluation.status === 'Completed').length / evaluations.length * 100) : 0, formula:'Completed evaluations ÷ all evaluations' },
    { label:'Pilot success', value:`${pilots.length ? Math.round(completedPilots / pilots.length * 100) : 0}%`, percent:pilots.length ? Math.round(completedPilots / pilots.length * 100) : 0, formula:'Completed pilots ÷ all pilots; completion is a workflow proxy, not verified impact' },
  ];
  const statusCounts = ['Active','Under Review','Completed'].map(status => ({ status, count:challenges.filter(challenge => challenge.status === status).length }));
  const activityMap = new Map();
  function addActivity(date, key) {
    if (!date) return;
    const month = date.slice(0,7);
    if (!activityMap.has(month)) activityMap.set(month, { proposals:0, pilots:0 });
    activityMap.get(month)[key] += 1;
  }
  proposals.forEach(proposal => addActivity(proposal.submissionDate, 'proposals'));
  pilots.forEach(pilot => addActivity(pilot.startDate, 'pilots'));
  const monthlyActivity = [...activityMap.entries()].sort(([a],[b]) => a.localeCompare(b)).map(([month,activity]) => ({ month, label:new Date(`${month}-01T00:00:00`).toLocaleDateString('en-IN',{month:'short',year:'2-digit'}), ...activity }));
  const maxActivity = Math.max(1, ...monthlyActivity.map(item => item.proposals + item.pilots));
  const summaryCards = [
    { label:'Total Challenges', value:challenges.length, icon:'Layers', bg:'#EBF2FF', color:'#173C70', note:'Current mock challenge records' },
    { label:'Active Pilots', value:activePilots, icon:'Activity', bg:'#E6F7F5', color:'#0F9D8A', note:'In progress or delayed' },
    { label:'Completed Pilots', value:completedPilots, icon:'CheckCircle', bg:'#EBF2FF', color:'#173C70', note:'Status marked completed' },
    { label:'Overall Progress', value:`${overallProgress}%`, icon:'TrendingUp', bg:'#FFF4E5', color:'#b45309', note:'Average progress across pilots' },
  ];

  function resetFilters() {
    setSearch(''); setDepartmentFilter('All'); setStatusFilter('All'); setDateFrom(''); setDateTo('');
  }

  return (
    <div className="page-content performance-page">
      <div className="welcome-bar"><div><h1 className="mc-page-title">Performance</h1><p className="mc-page-subtitle">A live summary of challenge activity, proposals, evaluations, and pilot delivery in this demo.</p></div></div>
      <p className="performance-demo-note"><Icon name="Info" size={14} color="#667085" /> Metrics are derived from current frontend mock records and are not verified real-world outcomes.</p>

      <div className="summary-grid pf-summary-grid">{summaryCards.map(card => <div className="summary-card" key={card.label}><div className="summary-icon" style={{background:card.bg}}><Icon name={card.icon} size={20} color={card.color} /></div><div className="pf-summary-copy"><div className="summary-value">{card.value}</div><div className="summary-label">{card.label}</div><div className="pf-summary-note">{card.note}</div></div></div>)}</div>

      <section className="pf-metrics-section"><div className="pf-section-heading"><div><h2>Program metrics</h2><p>Each rate is calculated from the current mock records shown below.</p></div></div><div className="pf-metric-grid">{metrics.map(metric => <article className="card pf-metric-card" key={metric.label}><div className="pf-metric-heading"><strong>{metric.label}</strong><span>{metric.value}</span></div><div className="pf-metric-track" role="img" aria-label={`${metric.label}: ${metric.value}`}><span style={{width:`${metric.percent}%`}} /></div><p>{metric.formula}</p></article>)}</div></section>

      <div className="pf-chart-grid">
        <section className="card pf-chart-card"><div className="pf-card-heading"><div><h2>Challenge status</h2><p>Current challenge records by status.</p></div></div><div className="pf-status-chart">{statusCounts.map(item => <div className="pf-status-item" key={item.status}><div className="pf-status-label"><span>{item.status}</span><strong>{item.count}</strong></div><div className="pf-chart-track"><span className={`pf-status-bar pf-status-${item.status.replace(' ','-').toLowerCase()}`} style={{width:`${challenges.length ? item.count / challenges.length * 100 : 0}%`}} /></div></div>)}</div></section>
        <section className="card pf-chart-card"><div className="pf-card-heading"><div><h2>Monthly activity</h2><p>Proposal submissions and pilot starts by recorded month.</p></div></div>{monthlyActivity.length ? <div className="pf-month-chart">{monthlyActivity.map(item => <div className="pf-month-row" key={item.month}><span className="pf-month-label">{item.label}</span><div className="pf-month-bars"><span className="pf-month-proposals" style={{width:`${item.proposals / maxActivity * 100}%`}} title={`${item.proposals} proposal submissions`} /><span className="pf-month-pilots" style={{width:`${item.pilots / maxActivity * 100}%`}} title={`${item.pilots} pilot starts`} /></div><span className="pf-month-count">{item.proposals + item.pilots}</span></div>)}<div className="pf-chart-legend"><span><i className="pf-month-proposals" />Proposal submissions</span><span><i className="pf-month-pilots" />Pilot starts</span></div></div> : <p className="pf-chart-empty">No dated activity is available.</p>}</section>
      </div>

      <section className="card pf-performance-list"><div className="card-header pf-list-header"><div><div className="card-title">Challenge performance</div><div className="mc-result-count">Showing {filtered.length} of {challenges.length} challenges</div></div><div className="pf-toolbar"><div className="search-wrap pf-search"><span className="search-icon"><Icon name="Search" size={14} color="#667085" /></span><input type="search" aria-label="Search challenge or startup" placeholder="Search challenge or startup…" value={search} onChange={event => setSearch(event.target.value)} /></div><select className="form-select pf-filter" aria-label="Filter challenges by department" value={departmentFilter} onChange={event => setDepartmentFilter(event.target.value)}><option value="All">All departments</option>{departments.map(department => <option key={department}>{department}</option>)}</select><select className="form-select pf-filter" aria-label="Filter challenges by status" value={statusFilter} onChange={event => setStatusFilter(event.target.value)}><option value="All">All statuses</option>{['Active','Under Review','Completed'].map(status => <option key={status}>{status}</option>)}</select><label className="pf-date-filter"><span>Deadline</span><input type="date" aria-label="Filter deadlines from" value={dateFrom} onChange={event => setDateFrom(event.target.value)} /><span>to</span><input type="date" aria-label="Filter deadlines through" value={dateTo} onChange={event => setDateTo(event.target.value)} /></label></div></div>
        {filtered.length ? <div className="table-wrap pf-table-wrap"><table className="pf-table"><thead><tr>{['Challenge','Department','Participating startups','Proposals','Pilot status','Progress','Action'].map(label => <th key={label}>{label}</th>)}</tr></thead><tbody>{filtered.map(({challenge,proposalCount,startupCount,departments:challengeDepartments,pilotStatus,progress})=><tr key={challenge.id}><td className="pf-challenge-cell" data-label="Challenge">{challenge.title}</td><td data-label="Department">{challengeDepartments.join(', ') || 'No pilot assigned'}</td><td data-label="Participating startups">{startupCount}</td><td data-label="Proposals">{proposalCount}</td><td data-label="Pilot status"><span className={`badge ${pilotStatus === 'No Pilot' ? 'badge-blue' : pilotStatus === 'Delayed' ? 'pt-status-delayed' : pilotStatus === 'Completed' ? 'badge-teal' : pilotStatus === 'In Progress' ? 'badge-blue' : 'badge-amber'}`}>{pilotStatus}</span></td><td className="pf-progress-cell" data-label="Progress">{progress === null ? <span>—</span> : <><div className="pf-table-track"><span style={{width:`${progress}%`}} /></div><strong>{progress}%</strong></>}</td><td className="pf-action-cell" data-label="Action"><button className="btn-secondary pf-detail-button" onClick={() => setSelectedChallenge(challenge)}><Icon name="BarChart2" size={14} /> Details</button></td></tr>)}</tbody></table></div> : <div className="mc-empty-state"><div className="mc-empty-icon"><Icon name="SearchX" size={22} color="#173C70" /></div><h2>No challenges match these filters</h2><p>Try another department, status, date range, or search term.</p><button className="btn-secondary" onClick={resetFilters}>Clear filters</button></div>}
      </section>

      {selectedChallenge && <PerformanceDetailsModal challenge={selectedChallenge} proposals={proposals} evaluations={evaluations} pilots={pilots} startups={matches} onClose={() => setSelectedChallenge(null)} onOpenChallenge={onOpenChallenge} />}
    </div>
  );
}

function SettingsPage({ settings, onSave, onReset, onDensityChange }) {
  const [form, setForm] = useState(() => ({ ...settings, notifications:{ ...settings.notifications } }));
  const [errors, setErrors] = useState({});
  const [notice, setNotice] = useState('');
  const [resetOpen, setResetOpen] = useState(false);
  const update = key => event => { const value=event.target.value; setForm(previous=>({...previous,[key]:value})); setErrors(previous=>({...previous,[key]:''})); setNotice(''); };

  function toggleNotification(key) {
    setForm(previous => ({ ...previous, notifications:{ ...previous.notifications, [key]:!previous.notifications[key] } }));
    setNotice('');
  }

  function save(event) {
    event.preventDefault();
    const nextErrors = {
      departmentName:form.departmentName.trim() ? '' : 'Enter a department name.',
      officerName:form.officerName.trim() ? '' : 'Enter the officer name.',
      designation:form.designation.trim() ? '' : 'Enter a designation.',
      email:!form.email.trim() ? 'Enter an email address.' : !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form.email.trim()) ? 'Enter a valid email address.' : '',
      contact:form.contact && !/^[+\d][\d\s().-]{6,19}$/.test(form.contact.trim()) ? 'Enter a valid phone number or leave this field blank.' : '',
      displayName:form.displayName.trim() ? '' : 'Enter a department display name.',
      departmentType:form.departmentType ? '' : 'Select a department type.',
      location:form.location.length > 100 ? 'Keep the location to 100 characters or fewer.' : '',
    };
    setErrors(nextErrors);
    if (Object.values(nextErrors).some(Boolean)) return;
    const saved = { ...form, departmentName:form.departmentName.trim(), officerName:form.officerName.trim(), designation:form.designation.trim(), email:form.email.trim(), contact:form.contact.trim(), displayName:form.displayName.trim(), location:form.location.trim(), notifications:{ ...form.notifications } };
    onSave(saved);
    setForm(saved);
    setNotice('Settings updated in this demo session.');
  }

  function confirmReset() {
    const defaults = { ...INITIAL_GOV_SETTINGS, notifications:{ ...INITIAL_GOV_SETTINGS.notifications } };
    setForm(defaults);
    setErrors({});
    onReset(defaults);
    setNotice('Demo settings restored to defaults for this session.');
    setResetOpen(false);
  }

  return (
    <div className={`page-content settings-page density-${form.density}`}>
      <div className="welcome-bar"><div><h1 className="mc-page-title">Settings</h1><p className="mc-page-subtitle">Manage your government profile and dashboard preferences for this demo session.</p></div><span className="badge badge-blue">Session only</span></div>
      {notice && <div className="mc-notice" role="status"><Icon name="CheckCircle" size={16} color="#0F9D8A" />{notice}</div>}
      <form className="settings-form" onSubmit={save} noValidate>
        <section className="card settings-section"><div className="settings-section-heading"><div className="settings-section-icon"><Icon name="UserRound" size={17} color="#173C70" /></div><div><h2>Government profile</h2><p>Contact details associated with this demo department.</p></div></div>
          <div className="settings-grid">
            <div className="form-group"><label className="form-label" htmlFor="settings-department">Department name</label><input id="settings-department" className={`form-input${errors.departmentName?' mc-input-error':''}`} value={form.departmentName} onChange={update('departmentName')} maxLength={100} aria-invalid={!!errors.departmentName} />{errors.departmentName&&<span className="mc-field-error" role="alert">{errors.departmentName}</span>}</div>
            <div className="form-group"><label className="form-label" htmlFor="settings-officer">Officer name</label><input id="settings-officer" className={`form-input${errors.officerName?' mc-input-error':''}`} value={form.officerName} onChange={update('officerName')} maxLength={80} aria-invalid={!!errors.officerName} />{errors.officerName&&<span className="mc-field-error" role="alert">{errors.officerName}</span>}</div>
            <div className="form-group"><label className="form-label" htmlFor="settings-designation">Designation</label><input id="settings-designation" className={`form-input${errors.designation?' mc-input-error':''}`} value={form.designation} onChange={update('designation')} maxLength={80} aria-invalid={!!errors.designation} />{errors.designation&&<span className="mc-field-error" role="alert">{errors.designation}</span>}</div>
            <div className="form-group"><label className="form-label" htmlFor="settings-email">Work email</label><input id="settings-email" type="email" className={`form-input${errors.email?' mc-input-error':''}`} value={form.email} onChange={update('email')} autoComplete="email" aria-invalid={!!errors.email} />{errors.email&&<span className="mc-field-error" role="alert">{errors.email}</span>}</div>
            <div className="form-group"><label className="form-label" htmlFor="settings-contact">Contact number <span className="settings-optional">Optional</span></label><input id="settings-contact" type="tel" className={`form-input${errors.contact?' mc-input-error':''}`} value={form.contact} onChange={update('contact')} autoComplete="tel" placeholder="Add a department contact number" aria-invalid={!!errors.contact} />{errors.contact&&<span className="mc-field-error" role="alert">{errors.contact}</span>}</div>
          </div>
        </section>

function PostChallengePage({ onCreate, onCancel, onViewChallenges }) {
  const [form, setForm] = useState({
    title:'', description:'', department:'', category:'', technologies:'',
    budgetMin:'', budgetMax:'', deadline:'', eligibility:'', expectedOutcomes:'', status:'Active',
  });
  const [attempted, setAttempted] = useState(false);
  const [created, setCreated] = useState(null);
  const technologies = form.technologies.split(/[;,\n]/).map(value => value.trim()).filter(Boolean);
  const minBudget = Number(form.budgetMin);
  const maxBudget = Number(form.budgetMax);
  const now = new Date();
  const today = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
  const errors = {
    ...validateChallengeBasics(form),
    description: form.description.trim().length < 30 ? 'Add at least 30 characters describing the challenge.' : form.description.length > 1000 ? 'Keep the description to 1,000 characters or fewer.' : '',
    department: form.department ? '' : 'Choose a department.',
    technologies: technologies.length === 0 ? 'Add at least one required technology.' : technologies.length > 10 ? 'List no more than 10 technologies.' : '',
    budgetMin: !form.budgetMin || !Number.isFinite(minBudget) || minBudget <= 0 ? 'Enter a minimum budget greater than zero.' : '',
    budgetMax: !form.budgetMax || !Number.isFinite(maxBudget) ? 'Enter a maximum budget.' : maxBudget <= minBudget ? 'Maximum budget must be greater than the minimum.' : '',
    deadline: !form.deadline ? 'Choose an application deadline.' : form.deadline <= today ? 'Choose a future application deadline.' : '',
    eligibility: form.eligibility.trim().length < 15 ? 'Describe eligibility in at least 15 characters.' : form.eligibility.length > 500 ? 'Keep eligibility to 500 characters or fewer.' : '',
    expectedOutcomes: form.expectedOutcomes.trim().length < 20 ? 'Describe expected outcomes in at least 20 characters.' : form.expectedOutcomes.length > 500 ? 'Keep expected outcomes to 500 characters or fewer.' : '',
  };

  const update = key => event => setForm(previous => ({ ...previous, [key]:event.target.value }));

  function submit(event) {
    event.preventDefault();
    setAttempted(true);
    if (Object.values(errors).some(Boolean)) return;
    const { technologies:technologyInput, budgetMin:minimum, budgetMax:maximum, ...details } = form;
    const challenge = {
      ...details,
      title:form.title.trim(),
      description:form.description.trim(),
      requiredTechnologies:technologies,
      budgetRange:{ minimum:Number(minimum), maximum:Number(maximum) },
      eligibility:form.eligibility.trim(),
      expectedOutcomes:form.expectedOutcomes.trim(),
      applications:0,
    };
    onCreate(challenge);
    setCreated(challenge);
  }

  if (created) {
    return (
      <div className="page-content fade-in post-challenge-page">
        <section className="card post-challenge-success" aria-live="polite">
          <div className="post-success-icon"><Icon name="Check" size={24} color="#0F9D8A" /></div>
          <h1>Challenge posted</h1>
          <p><strong>{created.title}</strong> is now in your demo challenge list. No data was sent to a server.</p>
          <div className="post-success-actions">
            <button className="btn-primary" onClick={onViewChallenges}><Icon name="List" size={15} color="#fff" /> View My Challenges</button>
            <button className="btn-secondary" onClick={onCancel}>Back to Dashboard</button>
          </div>
        </section>
      </div>
    );
  }

  return (
    <div className="page-content fade-in post-challenge-page">
      <div className="post-challenge-heading">
        <div>
          <button className="view-link post-back-link" onClick={onCancel}><Icon name="ArrowLeft" size={14} /> Back to Dashboard</button>
          <h1 className="mc-page-title">Post Challenge</h1>
          <p className="mc-page-subtitle">Define a public-sector problem and the outcomes you want teams to deliver.</p>
        </div>
        <span className="badge badge-teal">New challenge</span>
      </div>

      <form className="card post-challenge-form" onSubmit={submit} noValidate>
        <div className="post-form-section">
          <div className="post-form-section-heading">
            <h2>Challenge details</h2>
            <p>Describe the opportunity and where it belongs.</p>

          <div className="post-form-grid">
            <div className="form-group post-form-full">
              <label className="form-label" htmlFor="post-title">Challenge title <span className="post-required">Required</span></label>
              <input id="post-title" className={`form-input${attempted && errors.title ? ' mc-input-error' : ''}`} value={form.title} onChange={update('title')} maxLength={100} aria-invalid={attempted && !!errors.title} />
              {attempted && errors.title && <div className="mc-field-error" role="alert">{errors.title}</div>}
            </div>
            <div className="form-group post-form-full">
              <label className="form-label" htmlFor="post-description">Challenge description <span className="post-required">Required</span></label>
              <textarea id="post-description" className={`form-textarea post-large-textarea${attempted && errors.description ? ' mc-input-error' : ''}`} value={form.description} onChange={update('description')} maxLength={1000} placeholder="Explain the current problem, affected services and constraints…" aria-invalid={attempted && !!errors.description} />
              <div className="mc-character-count">{form.description.length}/1000</div>
              {attempted && errors.description && <div className="mc-field-error" role="alert">{errors.description}</div>}
            </div>
            <div className="form-group">
              <label className="form-label" htmlFor="post-department">Department <span className="post-required">Required</span></label>
              <select id="post-department" className={`form-select${attempted && errors.department ? ' mc-input-error' : ''}`} value={form.department} onChange={update('department')} aria-invalid={attempted && !!errors.department}>
                <option value="">Select department…</option>
                {CHALLENGE_DEPARTMENTS.map(department => <option key={department} value={department}>{department}</option>)}
              </select>
              {attempted && errors.department && <div className="mc-field-error" role="alert">{errors.department}</div>}

            <div className="form-group">

              <select id="post-category" className={`form-select${attempted && errors.category ? ' mc-input-error' : ''}`} value={form.category} onChange={update('category')} aria-invalid={attempted && !!errors.category}>
                <option value="">Select category…</option>
                {CHALLENGE_CATEGORIES.map(category => <option key={category} value={category}>{category}</option>)}

              {attempted && errors.category && <div className="mc-field-error" role="alert">{errors.category}</div>}

            <div className="form-group post-form-full">

              <input id="post-technologies" className={`form-input${attempted && errors.technologies ? ' mc-input-error' : ''}`} value={form.technologies} onChange={update('technologies')} placeholder="e.g. GIS, IoT, machine learning" aria-invalid={attempted && !!errors.technologies} />

              {attempted && errors.technologies && <div className="mc-field-error" role="alert">{errors.technologies}</div>}
