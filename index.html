// == DEMO AUTH UTILITIES =====================================================
// IMPORTANT: This is a browser-only college prototype.
// Client-side password hashing does NOT provide production security.
// No account data is sent to any server. Do not enter real passwords,
// government IDs (Aadhaar, PAN), or any sensitive personal information.
// Clearing browser data will remove all demo accounts.
// ============================================================================

const STORAGE_KEY  = 'civicbridge_demo_accounts'; // localStorage key
const SESSION_KEY  = 'civicbridge_demo_session';  // sessionStorage key
const PBKDF2_ITERS = 100000;  // work factor -- adequate for demo, not production
const PBKDF2_HASH  = 'SHA-256';
const PBKDF2_BITS  = 256;     // 32 bytes derived key length

// Role -> dashboard route key mapping (must match App router exactly)
const ROLE_DEST = {
  gov:       'govDashboard',

// Returns true only when SubtleCrypto PBKDF2 and getRandomValues are both
// available. We fail closed -- no weak fallback -- if either is missing.
function cryptoAvailable() {
  return !!(
    window.crypto &&
    typeof window.crypto.getRandomValues === 'function' &&
    window.crypto.subtle &&
    typeof window.crypto.subtle.importKey === 'function' &&
    typeof window.TextEncoder === 'function'
  );
}

// Encode an ArrayBuffer to a lowercase hex string.
function bufToHex(buf) {
  return Array.from(new Uint8Array(buf))
    .map(b => b.toString(16).padStart(2, '0'))
    .join('');
}

// Decode a hex string back to an ArrayBuffer.
function hexToBuf(hex) {
  return new Uint8Array(hex.match(/.{2}/g).map(h => parseInt(h, 16))).buffer;
}

// Generate a cryptographically random 16-byte (32 hex char) salt.
// Each account gets its own salt -- never a shared or hardcoded value.
function randomSalt() {
  if (!cryptoAvailable()) throw new Error('CRYPTO_UNAVAILABLE');
  const arr = new Uint8Array(16);
  window.crypto.getRandomValues(arr);
  return bufToHex(arr.buffer);
}

// Derive a PBKDF2 hash from a plaintext password + per-account hex salt.
// Returns { salt, hash, alg, iters } -- the plaintext password is never stored.
async function hashPassword(plaintext) {
  if (!cryptoAvailable()) throw new Error('CRYPTO_UNAVAILABLE');
  const salt    = randomSalt();
  const saltBuf = hexToBuf(salt);
  const keyMat  = await window.crypto.subtle.importKey(
    'raw',
    new TextEncoder().encode(plaintext),
    'PBKDF2',
    false,
    ['deriveBits']
  );
  const derived = await window.crypto.subtle.deriveBits(
    { name: 'PBKDF2', salt: saltBuf, iterations: PBKDF2_ITERS, hash: PBKDF2_HASH },
    keyMat,
    PBKDF2_BITS
  );
  return { salt, hash: bufToHex(derived), alg: 'PBKDF2', iters: PBKDF2_ITERS };
}

// Verify a plaintext password against a stored { salt, hash, alg, iters } record.
// Returns true only on an exact match. Throws if crypto is unavailable.
async function verifyPassword(plaintext, stored) {
  if (!cryptoAvailable()) throw new Error('CRYPTO_UNAVAILABLE');
  const keyMat  = await window.crypto.subtle.importKey(
    'raw',
    new TextEncoder().encode(plaintext),
    'PBKDF2',
    false,
    ['deriveBits']
  );
  const derived = await window.crypto.subtle.deriveBits(
    { name: 'PBKDF2', salt: hexToBuf(stored.salt), iterations: stored.iters, hash: PBKDF2_HASH },
    keyMat,
    PBKDF2_BITS
  );
  return bufToHex(derived) === stored.hash;
}

// Normalize an email address for consistent lookup and duplicate detection.
function normalizeEmail(email) {
  return (email || '').trim().toLowerCase();
}

// Load all demo accounts from localStorage.
// Returns [] on any error (missing key, malformed JSON, storage unavailable).
function loadAccounts() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return [];
    const parsed = JSON.parse(raw);
    return Array.isArray(parsed) ? parsed : [];
  } catch (_) {
    return [];
  }
}

// Persist the full accounts array to localStorage.
// Returns true on success, false if storage is unavailable or quota exceeded.
function saveAccounts(accounts) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(accounts));
    return true;
  } catch (_) {
    return false;
  }
}

// Find a registered account by normalized email. Returns the account or null.
function findAccount(email) {
  const norm = normalizeEmail(email);
  return loadAccounts().find(a => a.email === norm) || null;
}

// Append a new account record to localStorage.
// Returns { ok: true } or { ok: false, error: string }.
function appendAccount(account) {
  const accounts = loadAccounts();
  accounts.push(account);
  const saved = saveAccounts(accounts);
  return saved
    ? { ok: true }
    : { ok: false, error: 'Browser storage is unavailable or full. Cannot save demo account.' };
}

// -- Session utilities -------------------------------------------------------
// The active session stores only { id, email, role, fullName, displayName }.
// Passwords and password hashes are NEVER written to the session object.

function setSession(sessionObj) {
  try {
    sessionStorage.setItem(SESSION_KEY, JSON.stringify(sessionObj));
  } catch (_) {
    // sessionStorage unavailable -- session will not survive page reload
  }
}

function getSession() {
  try {
    const raw = sessionStorage.getItem(SESSION_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    // Reject any session object that somehow contains a password field
    if (parsed && (parsed.password || parsed.passwordHash)) return null;
    return parsed;
  } catch (_) {
    return null;
  }
}

function clearSession() {
  try {
    sessionStorage.removeItem(SESSION_KEY);
  } catch (_) {
    // ignore -- storage may already be unavailable
  }
}

// Derive two-letter initials from a full name (e.g. "Jane Doe" -> "JD").
function getInitials(name) {
  const parts = (name || '').trim().split(/\s+/).filter(Boolean);
  if (parts.length === 0) return '?';
  if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
}

// ── Shared: Icon ─────────────────────────────────────────────────────────────
function Icon({ name, size = 16, color = 'currentColor' }) {
  const ref = useRef(null);
  useEffect(() => {
    if (!ref.current || !window.lucide) return;
    const iconFn = window.lucide[name];
    if (!iconFn) return;
    const [, attrs, children] = typeof iconFn === 'function' ? iconFn() : iconFn;
    const ns = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(ns, 'svg');
    Object.entries({ ...attrs, width: size, height: size, color }).forEach(([k,v]) => svg.setAttribute(k,v));
    svg.style.display = 'block';
    (children||[]).forEach(([ct,ca]) => {
      const c = document.createElementNS(ns, ct);
      Object.entries(ca||{}).forEach(([k,v]) => c.setAttribute(k,v));
      svg.appendChild(c);
    });
    ref.current.innerHTML = '';
    ref.current.appendChild(svg);
  }, [name, size, color]);
  return <span ref={ref} style={{ display:'inline-flex', alignItems:'center', justifyContent:'center', lineHeight:0, flexShrink:0 }} />;
}

function StartupsPage({ setPage }) {

  const ALL_TAGS = ['All', ...Array.from(new Set(PUBLIC_STARTUPS.flatMap(s => s.tags))).sort()];

  const filtered = PUBLIC_STARTUPS.filter(s => {
    const q = query.toLowerCase();

function LoginPage({ setPage }) {
  const [email,       setEmail]       = useState('');
  const [password,    setPassword]    = useState('');
  const [showPw,      setShowPw]      = useState(false);
  const [emailError,  setEmailError]  = useState('');
  const [touched,     setTouched]     = useState({ email: false, password: false });

  function validateEmail(val) {
    if (!val.trim()) return 'Email address is required.';
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val.trim())) return 'Enter a valid email address.';
    return '';
  }

  function handleEmailBlur() {
    setTouched(t => ({ ...t, email: true }));
    setEmailError(validateEmail(email));
  }

  function handleSubmit() {
    const err = validateEmail(email);
    setTouched({ email: true, password: true });
    setEmailError(err);
    if (err) return;
    // Prototype: no real auth — navigate to role selection
    setPage('roleSelect');
  }

  return (
    <div className="login-page">
      {/* Left panel — branding */}
      <div className="login-brand">
        <div className="login-brand-inner">

            <div className="logo-mark" style={{ width:44, height:44 }}>

            <span className="login-brand-name">CivicBridge</span>

            Connecting government departments with innovative startups through structured challenges, expert evaluation and real-world pilots.

          <div className="login-brand-points">
            <div className="login-brand-point">
              <div className="login-brand-point-icon"><Icon name="Building2" size={14} color="#0F9D8A" /></div>
              <span>Post and manage government challenges</span>
            </div>
            <div className="login-brand-point">
              <div className="login-brand-point-icon"><Icon name="Rocket" size={14} color="#0F9D8A" /></div>
              <span>Discover opportunities as a startup</span>
            </div>
            <div className="login-brand-point">
              <div className="login-brand-point-icon"><Icon name="ClipboardCheck" size={14} color="#0F9D8A" /></div>
              <span>Evaluate proposals as an independent expert</span>
            </div>
          </div>
        </div>
      </div>

      {/* Right panel — form */}

        <div className="login-form-inner">

          <div className="login-mobile-logo">
            <div className="logo-mark" style={{ width:36, height:36 }}>
              <Icon name="Building2" size={18} color="#fff" />

            <span className="login-brand-name" style={{ color:'#173C70' }}>CivicBridge</span>

          <h1 className="login-heading">Sign in to your account</h1>

            <input
              id="login-email"

              type="email"

              value={email}
              onChange={e => { setEmail(e.target.value); if (touched.email) setEmailError(validateEmail(e.target.value)); }}
              onBlur={handleEmailBlur}

            />
            {touched.email && emailError && (

function StartupProposalPreparationModal({ challenge, onClose, onSubmit, onViewProposals }) {
  const [form,setForm]=useState({title:`Solution for ${challenge.title}`,solution:'',technologies:challenge.tags.join(', '),budget:'',expectedOutcomes:''});
  const [errors,setErrors]=useState({});
  const [submitted,setSubmitted]=useState(false);
  const update=key=>event=>{setForm(previous=>({...previous,[key]:event.target.value}));setErrors(previous=>({...previous,[key]:''}));};

  useEffect(() => {
    const onKey = event => { if (event.key === 'Escape') onClose(); };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [onClose]);

  function submit(event) {
    event.preventDefault();
    const technologies=form.technologies.split(/[;,\n]/).map(value=>value.trim()).filter(Boolean);
    const budget=Number(form.budget);
    const nextErrors={
      title:form.title.trim().length<5?'Enter a proposal title with at least 5 characters.':'',
      solution:form.solution.trim().length<30?'Describe your solution in at least 30 characters.':'',
      technologies:technologies.length===0?'Add at least one technology.':'',
      budget:!form.budget||!Number.isFinite(budget)||budget<=0?'Enter an estimated budget greater than zero.':'',
      expectedOutcomes:form.expectedOutcomes.trim().length<20?'Describe expected outcomes in at least 20 characters.':'',
    };
    setErrors(nextErrors);
    if(Object.values(nextErrors).some(Boolean)) return;
    const now=new Date();
    const submissionDate=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
    onSubmit({id:Date.now(),title:form.title.trim(),startupId:2,challengeId:challenge.id,submissionDate,status:'Proposal Submitted',description:form.solution.trim(),solution:form.solution.trim(),technologies,estimatedBudget:budget,expectedOutcomes:form.expectedOutcomes.trim()});
    setSubmitted(true);
  }

  return (
    <div className="modal-overlay discovery-modal startup-challenge-modal" onClick={event=>{if(event.target===event.currentTarget)onClose();}}>
      <div className="modal-box" role="dialog" aria-modal="true" aria-labelledby="startup-proposal-title">
        {submitted?<><div className="modal-header"><span className="modal-title" id="startup-proposal-title">Proposal prepared</span><button className="icon-btn" onClick={onClose} aria-label="Close proposal confirmation"><Icon name="X" size={16} /></button></div><div className="modal-body"><div className="proposal-success"><div className="proposal-success-icon"><Icon name="Check" size={22} color="#0F9D8A" /></div><h2>{form.title}</h2><p>Your proposal was added to My Proposals in this demo session. No data was sent to a server.</p></div></div><div className="modal-footer"><button className="btn-secondary" onClick={onClose}>Close</button><button className="btn-primary" onClick={onViewProposals}><Icon name="FileText" size={14} color="#fff" /> View My Proposals</button></div></>:<form onSubmit={submit} noValidate><div className="modal-header"><div><span className="modal-title" id="startup-proposal-title">Prepare Proposal</span><span className="proposal-modal-subtitle">{challenge.title}</span></div><button type="button" className="icon-btn" onClick={onClose} aria-label="Close proposal form"><Icon name="X" size={16} /></button></div><div className="modal-body">
          <div className="form-group"><label className="form-label" htmlFor="startup-proposal-title-input">Proposal title</label><input id="startup-proposal-title-input" className={`form-input${errors.title?' mc-input-error':''}`} value={form.title} onChange={update('title')} maxLength={100} />{errors.title&&<span className="mc-field-error" role="alert">{errors.title}</span>}</div>
          <div className="form-group"><label className="form-label" htmlFor="startup-proposal-solution">Proposed solution</label><textarea id="startup-proposal-solution" className={`form-textarea proposal-solution-input${errors.solution?' mc-input-error':''}`} value={form.solution} onChange={update('solution')} maxLength={1000} placeholder="Describe your proposed approach and how it addresses the challenge…" />{errors.solution&&<span className="mc-field-error" role="alert">{errors.solution}</span>}</div>
          <div className="form-group"><label className="form-label" htmlFor="startup-proposal-technologies">Technologies</label><input id="startup-proposal-technologies" className={`form-input${errors.technologies?' mc-input-error':''}`} value={form.technologies} onChange={update('technologies')} placeholder="Separate technologies with commas" />{errors.technologies&&<span className="mc-field-error" role="alert">{errors.technologies}</span>}</div>
          <div className="proposal-form-grid"><div className="form-group"><label className="form-label" htmlFor="startup-proposal-budget">Estimated budget</label><input id="startup-proposal-budget" type="number" min="1" step="1000" className={`form-input${errors.budget?' mc-input-error':''}`} value={form.budget} onChange={update('budget')} placeholder="Amount in INR" />{errors.budget&&<span className="mc-field-error" role="alert">{errors.budget}</span>}</div><div className="form-group"><label className="form-label" htmlFor="startup-proposal-outcomes">Expected outcomes</label><textarea id="startup-proposal-outcomes" className={`form-textarea${errors.expectedOutcomes?' mc-input-error':''}`} value={form.expectedOutcomes} onChange={update('expectedOutcomes')} maxLength={500} placeholder="Describe measurable outcomes…" />{errors.expectedOutcomes&&<span className="mc-field-error" role="alert">{errors.expectedOutcomes}</span>}</div></div>
          <p className="discovery-demo-note">Proposal details remain in this frontend demo session only.</p>
        </div><div className="modal-footer"><button type="button" className="btn-secondary" onClick={onClose}>Cancel</button><button type="submit" className="btn-primary"><Icon name="Send" size={14} color="#fff" /> Submit Proposal</button></div></form>}
      </div>
    </div>
  );
}

function StartupChallengesPage({ startup, challenges, matches, savedChallengeIds, onToggleSave, onSubmitProposal, onViewProposals, onBack }) {
  const [query,setQuery]=useState('');
  const [categoryFilter,setCategoryFilter]=useState('All');
  const [departmentFilter,setDepartmentFilter]=useState('All');
  const [statusFilter,setStatusFilter]=useState('All');
  const [selectedChallenge,setSelectedChallenge]=useState(null);
  const [proposalChallenge,setProposalChallenge]=useState(null);
  const [notice,setNotice]=useState('');
  const startupTags=new Set(startup.tags.map(tag=>tag.toLowerCase()));
  const categories=[...new Set(challenges.map(challenge=>challenge.category))].sort();
  const departments=[...new Set(challenges.map(challenge=>challenge.dept))].sort();
  const statuses=[...new Set(challenges.map(challenge=>challenge.stage))].sort();
  const enriched=challenges.map(challenge=>{
    const sharedTags=challenge.tags.filter(tag=>startupTags.has(tag.toLowerCase()));
    const linkedChallenge=INITIAL_GOV_CHALLENGES.find(item=>item.title===challenge.title);
    const match=matches.find(item=>item.challengeId===(linkedChallenge?.id||challenge.id));
    return {...challenge,sharedTags,match,linkedChallenge};
  });
  const filtered=enriched.filter(challenge=>{
    const searchable=`${challenge.title} ${challenge.dept} ${challenge.category} ${challenge.tags.join(' ')} ${challenge.desc}`.toLowerCase();
    return (!query.trim()||searchable.includes(query.trim().toLowerCase()))
      && (categoryFilter==='All'||challenge.category===categoryFilter)
      && (departmentFilter==='All'||challenge.dept===departmentFilter)
      && (statusFilter==='All'||challenge.stage===statusFilter);
  });
  function toggleSaved(challenge) {
    const alreadySaved=savedChallengeIds.includes(challenge.id);
    onToggleSave(challenge.id);
    setNotice(alreadySaved?`${challenge.title} removed from Saved Challenges.`:`${challenge.title} added to Saved Challenges.`);
  }
  function clearFilters() {
    setQuery(''); setCategoryFilter('All'); setDepartmentFilter('All'); setStatusFilter('All');
  }

  return (
    <div className="page-content fade-in startup-challenges-page">
      <div className="welcome-bar"><div><h1 className="mc-page-title">Browse Challenges</h1><p className="mc-page-subtitle">Explore government opportunities that share your technology capabilities.</p></div><button className="btn-secondary" onClick={onBack}><Icon name="ArrowLeft" size={14} /> Overview</button></div>
      {notice&&<div className="mc-notice" role="status"><Icon name="BookmarkCheck" size={15} color="#0F9D8A" />{notice}<span className="startup-demo-only">Saved in this demo session.</span></div>}
      <div className="startup-challenge-toolbar"><div className="search-wrap startup-challenge-search"><span className="search-icon"><Icon name="Search" size={14} color="#667085" /></span><input aria-label="Search challenges" placeholder="Search title, department, or technology…" value={query} onChange={event=>setQuery(event.target.value)} /></div><select className="form-select startup-challenge-filter" aria-label="Filter challenges by category" value={categoryFilter} onChange={event=>setCategoryFilter(event.target.value)}><option value="All">All categories</option>{categories.map(category=><option key={category}>{category}</option>)}</select><select className="form-select startup-challenge-filter" aria-label="Filter challenges by department" value={departmentFilter} onChange={event=>setDepartmentFilter(event.target.value)}><option value="All">All departments</option>{departments.map(department=><option key={department}>{department}</option>)}</select><select className="form-select startup-challenge-filter" aria-label="Filter challenges by status" value={statusFilter} onChange={event=>setStatusFilter(event.target.value)}><option value="All">All statuses</option>{statuses.map(status=><option key={status}>{status}</option>)}</select></div>
      <div className="startup-results-count">{filtered.length} of {challenges.length} challenges</div>
      <div className="card startup-browse-card"><div className="table-wrap"><table className="startup-challenge-table"><thead><tr>{['Challenge','Category','Department','Status','Deadline','Technology fit','Actions'].map(label=><th key={label}>{label}</th>)}</tr></thead><tbody>{filtered.map(challenge=><tr key={challenge.id}><td className="startup-challenge-title">{challenge.title}<span>{challenge.desc}</span></td><td>{challenge.category}</td><td>{challenge.dept}</td><td><span className={`badge ${challenge.badge}`}>{challenge.stage}</span></td><td>{challenge.deadline}</td><td>{challenge.match?<span className="badge badge-teal">{challenge.match.matchScore}% match</span>:challenge.sharedTags.length?`${challenge.sharedTags.length} shared`:'Related domain'}</td><td className="startup-challenge-actions"><button className="btn-secondary" onClick={()=>setSelectedChallenge(challenge)}><Icon name="Eye" size={14} /> Details</button><button className={`btn-secondary${savedChallengeIds.includes(challenge.id)?' startup-saved-button':''}`} aria-pressed={savedChallengeIds.includes(challenge.id)} onClick={()=>toggleSaved(challenge)}><Icon name={savedChallengeIds.includes(challenge.id)?'BookmarkCheck':'BookmarkPlus'} size={14} />{savedChallengeIds.includes(challenge.id)?'Saved':'Save'}</button><button className="btn-primary" onClick={()=>setProposalChallenge(challenge)}><Icon name="FileText" size={14} color="#fff" /> Prepare Proposal</button></td></tr>)}</tbody></table>{!filtered.length&&<div className="mc-empty-state"><div className="mc-empty-icon"><Icon name="SearchX" size={22} color="#173C70" /></div><h2>No challenges found</h2><p>Try another title, category, department, or status filter.</p><button className="btn-secondary" onClick={clearFilters}>Clear filters</button></div>}</div></div>
      {selectedChallenge&&<StartupChallengeDetailsModal challenge={selectedChallenge} match={selectedChallenge.match} linkedChallenge={selectedChallenge.linkedChallenge} isSaved={savedChallengeIds.includes(selectedChallenge.id)} onToggleSave={toggleSaved} onClose={()=>setSelectedChallenge(null)} onPrepare={challenge=>{setSelectedChallenge(null);setProposalChallenge(challenge);}} />}
      {proposalChallenge&&<StartupProposalPreparationModal challenge={proposalChallenge} onClose={()=>setProposalChallenge(null)} onSubmit={onSubmitProposal} onViewProposals={()=>{setProposalChallenge(null);onViewProposals();}} />}
    </div>
  );
}

function startupChallengeForProposal(proposal, challenges) {
  const directMatch=challenges.find(challenge=>challenge.id===proposal.challengeId);
  if(directMatch)return directMatch;
  const governmentChallenge=INITIAL_GOV_CHALLENGES.find(challenge=>challenge.id===proposal.challengeId);
  return challenges.find(challenge=>challenge.title===governmentChallenge?.title);
}

function startupProposalIsEditable(proposal) {
  return ['Proposal Submitted','Pending Review','Revisions Requested'].includes(proposal.status);
}

function formatStartupProposalBudget(value) {
  if (value === undefined || value === null || value === '') return 'Not provided';
  return new Intl.NumberFormat('en-IN', { style:'currency', currency:'INR', maximumFractionDigits:0 }).format(value);
}

function StartupProposalDetailsModal({ proposal, challenge, onClose, onSave }) {
  const [editing,setEditing]=useState(false);
  const [form,setForm]=useState({
    title:proposal.title||'',
    description:proposal.description||'',
    solution:proposal.solution||'',
    technologies:(proposal.technologies||[]).join(', '),
    estimatedBudget:proposal.estimatedBudget??'',
    expectedOutcomes:proposal.expectedOutcomes||'',
  });
  const [errors,setErrors]=useState({});
  const [saved,setSaved]=useState(false);
  const editable=startupProposalIsEditable(proposal);
  const update=key=>event=>{
    setForm(previous=>({...previous,[key]:event.target.value}));
    setErrors(previous=>({...previous,[key]:''}));
    setSaved(false);
  };

  useEffect(() => {
    const onKey=event=>{if(event.key==='Escape')onClose();};
    document.addEventListener('keydown',onKey);
    return ()=>document.removeEventListener('keydown',onKey);
  },[onClose]);

  function save(event) {
    event.preventDefault();
    const technologies=form.technologies.split(/[;,\n]/).map(value=>value.trim()).filter(Boolean);
    const budget=form.estimatedBudget===''?'':Number(form.estimatedBudget);
    const nextErrors={
      title:form.title.trim().length<5?'Enter a proposal title with at least 5 characters.':'',
      description:form.description.trim()?'':'Enter a short proposal description.',
      solution:form.solution.trim().length<30?'Describe your solution in at least 30 characters.':'',
      technologies:technologies.length===0?'Add at least one technology.':'',
      estimatedBudget:budget!==''&&(!Number.isFinite(budget)||budget<=0)?'Enter a budget greater than zero, or leave it blank.':'',
      expectedOutcomes:form.expectedOutcomes.trim()?'':'Describe the expected outcomes.',
    };
    setErrors(nextErrors);
    if(Object.values(nextErrors).some(Boolean))return;
    onSave({...proposal,title:form.title.trim(),description:form.description.trim(),solution:form.solution.trim(),technologies,estimatedBudget:budget,expectedOutcomes:form.expectedOutcomes.trim()});
    setEditing(false);
    setSaved(true);
  }

  function beginEditing(event) {
    event.preventDefault();
    setSaved(false);
    setEditing(true);
  }

  const readOnlyField=(label,value)=> <section className="startup-proposal-detail-section"><h3>{label}</h3><p>{value||'Not provided'}</p></section>;
  const field=(key,label,options={})=>(
    <div className="form-group">
      <label className="form-label" htmlFor={`startup-edit-${key}`}>{label}</label>
      {options.multiline
        ? <textarea id={`startup-edit-${key}`} className={`form-textarea${options.solution?' proposal-solution-input':''}${errors[key]?' mc-input-error':''}`} value={form[key]} onChange={update(key)} maxLength={options.maxLength||1000} />
        : <input id={`startup-edit-${key}`} type={options.number?'number':'text'} min={options.number?'1':undefined} className={`form-input${errors[key]?' mc-input-error':''}`} value={form[key]} onChange={update(key)} maxLength={options.maxLength||undefined} />}
      {errors[key]&&<span className="mc-field-error" role="alert">{errors[key]}</span>}
    </div>
  );
  const budget=formatStartupProposalBudget(proposal.estimatedBudget);

  return (
    <div className="modal-overlay startup-proposal-modal" onClick={event=>{if(event.target===event.currentTarget)onClose();}}>
      <div className="modal-box" role="dialog" aria-modal="true" aria-labelledby="startup-proposal-detail-title">
        <div className="modal-header"><div><span className="modal-title">Proposal details</span><span className="proposal-modal-subtitle">{challenge?.title||'Challenge unavailable'}</span></div><button className="icon-btn" onClick={onClose} aria-label="Close proposal details"><Icon name="X" size={16} /></button></div>
        <div className="modal-body">
          {saved&&<div className="mc-notice" role="status"><Icon name="CheckCircle" size={15} color="#0F9D8A" /> Proposal changes saved in this demo session.</div>}
          <div className="startup-proposal-detail-heading"><div><h2 id="startup-proposal-detail-title">{proposal.title}</h2><span className={`badge ${proposalStatusBadge(proposal.status)}`}>{proposal.status}</span></div><span>Submitted {formatProposalDate(proposal.submissionDate)}</span></div>
          <div className="startup-proposal-linked-challenge"><span>Related challenge</span><strong>{challenge?.title||'Challenge unavailable'}</strong>{challenge&&<small>{challenge.category} · {challenge.dept} · {challenge.stage}</small>}</div>
          {editing
            ? <form id="startup-proposal-edit-form" onSubmit={save} noValidate>
                {field('title','Proposal title',{maxLength:100})}
                {field('description','Proposal description',{multiline:true,maxLength:500})}
                {field('solution','Proposed solution',{multiline:true,solution:true,maxLength:1000})}
                {field('technologies','Technologies')}
                {field('estimatedBudget','Estimated budget (INR)',{number:true})}
                {field('expectedOutcomes','Expected outcomes',{multiline:true,maxLength:500})}
              </form>
            : <>
                {readOnlyField('Proposal description',proposal.description)}
                {readOnlyField('Proposed solution',proposal.solution)}
                <section className="startup-proposal-detail-section"><h3>Technologies</h3><div className="discovery-tech-list">{(proposal.technologies||[]).length?proposal.technologies.map(technology=><span key={technology}>{technology}</span>):<p>Not provided</p>}</div></section>
                {readOnlyField('Estimated budget',budget)}
                {readOnlyField('Expected outcomes',proposal.expectedOutcomes)}
                {proposal.reviewNote&&readOnlyField('Latest review note',proposal.reviewNote)}
                {!editable&&<p className="startup-proposal-locked" role="status">This proposal is finalized and cannot be edited.</p>}
              </>}
        </div>
        <div className="modal-footer">{editing
          ? <><button type="button" className="btn-secondary" onClick={()=>{setEditing(false);setErrors({});}}>Cancel</button><button type="submit" form="startup-proposal-edit-form" className="btn-primary"><Icon name="Save" size={14} color="#fff" /> Save Changes</button></>
          : <><button type="button" className="btn-secondary" onClick={onClose}>Close</button>{editable&&<form className="startup-proposal-edit-trigger" onSubmit={beginEditing}><button type="submit" className="btn-primary"><Icon name="Pencil" size={14} color="#fff" /> Edit Proposal</button></form>}</>}
        </div>
      </div>
    </div>
  );
}

function StartupPilotDetailsModal({ pilot, challenge, startup, onClose, onUpdate }) {
  const [notes,setNotes]=useState(pilot.notes||'');
  const [milestones,setMilestones]=useState(()=>pilot.milestones.map(milestone=>({...milestone})));
  const [errors,setErrors]=useState({});
  const [saved,setSaved]=useState(false);
  const completed=pilot.status==='Completed';
  const progress=completed?100:pilot.progress;
  const nextMilestone=milestones.find(milestone=>milestone.status!=='Completed');
  const updateMilestone=(id,status)=>{
    setMilestones(previous=>previous.map(milestone=>milestone.id===id?{...milestone,status}:milestone));
    setErrors(previous=>({...previous,notes:'',milestones:''}));
    setSaved(false);
  };

  useEffect(()=>{
    const onKey=event=>{if(event.key==='Escape')onClose();};
    document.addEventListener('keydown',onKey);
    return ()=>document.removeEventListener('keydown',onKey);
  },[onClose]);

  function save(event) {
    event.preventDefault();
    const nextErrors={};
    if(notes.trim()&&notes.trim().length<10)nextErrors.notes='Enter at least 10 characters or leave the notes blank.';
    if(!milestones.length)nextErrors.milestones='This pilot has no milestones to update.';
    setErrors(nextErrors);
    if(Object.keys(nextErrors).length)return;
    const allComplete=milestones.every(milestone=>milestone.status==='Completed');
    const nextStatus=allComplete?'Completed':milestones.some(milestone=>milestone.status==='Delayed')?'Delayed':milestones.some(milestone=>milestone.status==='In Progress')?'In Progress':'Planned';
    const nextProgress=allComplete?100:Math.round(milestones.filter(milestone=>milestone.status==='Completed').length/milestones.length*100);
    onUpdate({...pilot,milestones,notes:notes.trim(),status:nextStatus,progress:nextProgress});
    setSaved(true);
  }

  return (
    <div className="modal-overlay startup-pilot-modal" onClick={event=>{if(event.target===event.currentTarget)onClose();}}>
      <div className="modal-box" role="dialog" aria-modal="true" aria-labelledby="startup-pilot-detail-title">
        <div className="modal-header"><div><span className="modal-title">Pilot details</span><span className="proposal-modal-subtitle">{challenge?.title||'Challenge unavailable'}</span></div><button className="icon-btn" onClick={onClose} aria-label="Close pilot details"><Icon name="X" size={16} /></button></div>
        <div className="modal-body">
          {saved&&<div className="mc-notice" role="status"><Icon name="CheckCircle" size={15} color="#0F9D8A" /> Pilot progress saved in this demo session.</div>}
          <div className="startup-pilot-detail-heading"><div><h2 id="startup-pilot-detail-title">{pilot.name}</h2><span>{pilot.department} · {startup?.name||'Startup unavailable'}</span></div><span className={`badge ${pilotStatusBadge(pilot.status)}`}>{pilot.status}</span></div>
          <div className="startup-proposal-linked-challenge"><span>Related challenge</span><strong>{challenge?.title||'Challenge unavailable'}</strong>{challenge&&<small>{challenge.category} · {challenge.dept}</small>}</div>
          <section className="startup-proposal-detail-section"><h3>Objectives</h3><p>{pilot.objectives||'No objectives recorded.'}</p></section>
          <section className="startup-pilot-progress-section"><h3>Progress</h3><div className="pt-progress-track"><span style={{width:`${progress}%`}} /></div><div className="pt-progress-caption"><strong>{progress}%</strong><span>Expected completion {formatProposalDate(pilot.endDate)}</span></div></section>
          <section className="startup-pilot-milestone-section"><h3>Milestones and due dates</h3>{milestones.map((milestone,index)=><div className="startup-pilot-edit-milestone" key={milestone.id}><div className={`pt-milestone-marker${milestone.status==='Completed'?' is-complete':milestone.status==='Delayed'?' is-delayed':''}`}>{milestone.status==='Completed'?<Icon name="Check" size={11} color="#fff" />:index+1}</div><div className="startup-pilot-edit-copy"><strong>{milestone.title}</strong><span>{formatProposalDate(milestone.dueDate)}</span></div><span className={`badge ${pilotStatusBadge(milestone.status)}`}>{milestone.status}</span></div>)}</section>
          {!completed
            ? <form id="startup-pilot-progress-form" onSubmit={save} noValidate>
                <section className="startup-pilot-milestone-section"><h3>Update milestone status</h3>{milestones.map(milestone=><div className="startup-pilot-status-row" key={milestone.id}><label htmlFor={`startup-pilot-${pilot.id}-${milestone.id}`}>{milestone.title}<span>Due {formatProposalDate(milestone.dueDate)}</span></label><select id={`startup-pilot-${pilot.id}-${milestone.id}`} className="form-select" aria-label={`Milestone status: ${milestone.title}`} value={milestone.status} onChange={event=>updateMilestone(milestone.id,event.target.value)}><option>Planned</option><option>In Progress</option><option>Delayed</option><option>Completed</option></select></div>)}</section>
                {errors.milestones&&<span className="mc-field-error" role="alert">{errors.milestones}</span>}
                <div className="form-group startup-pilot-notes"><label className="form-label" htmlFor="startup-pilot-notes">Progress notes</label><textarea id="startup-pilot-notes" className={`form-textarea${errors.notes?' mc-input-error':''}`} value={notes} onChange={event=>{setNotes(event.target.value);setErrors(previous=>({...previous,notes:''}));setSaved(false);}} maxLength={500} placeholder="Record progress updates for your government partner…" />{errors.notes&&<span className="mc-field-error" role="alert">{errors.notes}</span>}<span className="startup-pilot-notes-count">{notes.length}/500</span></div>
              </form>
            : <><section className="startup-proposal-detail-section"><h3>Progress notes</h3><p>{pilot.notes||'No notes recorded.'}</p></section><p className="startup-pilot-readonly" role="status">This pilot is completed and its milestones and notes are read-only.</p></>}
          {!completed&&saved&&<div className="startup-pilot-next-milestone"><strong>Next milestone</strong><span>{nextMilestone?.title||'All milestones complete'}</span></div>}
        </div>
        <div className="modal-footer">{completed
          ? <button type="button" className="btn-secondary" onClick={onClose}>Close</button>
          : <><button type="button" className="btn-secondary" onClick={onClose}>Close</button><button type="submit" form="startup-pilot-progress-form" className="btn-primary"><Icon name="Save" size={14} color="#fff" /> Save Progress</button></>}
        </div>
      </div>
    </div>
  );
}

    const challenge=challenges.find(item=>item.id===pilot.challengeId)||INITIAL_GOV_CHALLENGES.find(item=>item.id===pilot.challengeId);
    return (!term||`${pilot.name} ${pilot.department||''} ${challenge?.title||''} ${pilot.objectives||''} ${pilot.notes||''}`.toLowerCase().includes(term))&&(statusFilter==='All'||pilot.status===statusFilter);

  const completedCount=pilots.filter(pilot=>pilot.status==='Completed').length;
  const averageProgress=pilots.length?Math.round(pilots.reduce((total,pilot)=>total+(pilot.status==='Completed'?100:pilot.progress),0)/pilots.length):0;
  const selectedPilot=pilots.find(pilot=>pilot.id===selectedPilotId);

  return (
    <div className="page-content fade-in startup-pilots-page">
      <div className="welcome-bar"><div><h1 className="mc-page-title">Active Pilot</h1><p className="mc-page-subtitle">Track milestones and share progress with your government partners.</p></div><button className="btn-secondary" onClick={onBack}><Icon name="ArrowLeft" size={14} /> Overview</button></div>
      <div className="summary-grid startup-pilot-summary">
        {[{label:'Total Pilots',value:pilots.length,icon:'Rocket',color:'#173C70',bg:'#EBF2FF'},{label:'Active Pilots',value:activeCount,icon:'Activity',color:'#b45309',bg:'#FFF4E5'},{label:'Completed',value:completedCount,icon:'CheckCircle',color:'#0F9D8A',bg:'#E6F7F5'},{label:'Average Progress',value:`${averageProgress}%`,icon:'TrendingUp',color:'#6d28d9',bg:'#F3EEFF'}].map(card=><div className="summary-card" key={card.label}><div className="summary-icon" style={{background:card.bg}}><Icon name={card.icon} size={19} color={card.color} /></div><div><div className="summary-value">{card.value}</div><div className="summary-label">{card.label}</div></div></div>)}
      </div>
      <div className="startup-pilot-toolbar"><div className="search-wrap"><span className="search-icon"><Icon name="Search" size={14} color="#667085" /></span><input aria-label="Search pilots" placeholder="Search pilot, challenge, or department…" value={query} onChange={event=>setQuery(event.target.value)} /></div><select className="form-select" aria-label="Filter pilots by status" value={statusFilter} onChange={event=>setStatusFilter(event.target.value)}><option value="All">All statuses</option>{statuses.map(status=><option key={status}>{status}</option>)}</select><span className="startup-pilot-results">{filtered.length} of {pilots.length} pilots</span></div>
      {filtered.length
        ? <div className="startup-pilot-list">{filtered.map(pilot=>{
            const challenge=challenges.find(item=>item.id===pilot.challengeId)||INITIAL_GOV_CHALLENGES.find(item=>item.id===pilot.challengeId);
            const nextMilestone=pilot.milestones.find(milestone=>milestone.status!=='Completed');
            const progress=pilot.status==='Completed'?100:pilot.progress;
            return <article className="card startup-pilot-card" key={pilot.id}>
              <div className="startup-pilot-heading"><div><h2>{pilot.name}</h2><span>{challenge?.title||'Challenge unavailable'}</span></div><span className={`badge ${pilotStatusBadge(pilot.status)}`}>{pilot.status}</span></div>
              <div className="startup-pilot-department"><Icon name="Building2" size={13} />{pilot.department||'Department unavailable'}</div>
              <div className="startup-pilot-progress"><div className="pt-progress-track"><span style={{width:`${progress}%`}} /></div><strong>{progress}%</strong></div>
              <div className="startup-pilot-card-meta"><span><small>Next milestone</small><strong>{pilot.status==='Completed'?'All milestones complete':nextMilestone?.title||'No milestones recorded'}</strong>{nextMilestone&&pilot.status!=='Completed'&&<small>Due {formatProposalDate(nextMilestone.dueDate)}</small>}</span><span><small>Expected completion</small><strong>{formatProposalDate(pilot.endDate)}</strong></span></div>
              <div className="startup-pilot-card-footer"><span>{pilot.milestones.filter(milestone=>milestone.status==='Completed').length} of {pilot.milestones.length} milestones complete</span><button className="btn-secondary" onClick={()=>setSelectedPilotId(pilot.id)}><Icon name="Eye" size={14} /> Details</button></div>
            </article>;
          })}</div>
        : <div className="mc-empty-state"><div className="mc-empty-icon"><Icon name="SearchX" size={22} color="#173C70" /></div><h2>{pilots.length?'No matching pilots':'No pilots yet'}</h2><p>{pilots.length?'Try another search term or status filter.':'No pilot records are currently linked to '+startup.name+'.'}</p>{pilots.length&&<button className="btn-secondary" onClick={()=>{setQuery('');setStatusFilter('All');}}>Clear filters</button>}</div>}
      {selectedPilot&&<StartupPilotDetailsModal key={selectedPilot.id} pilot={selectedPilot} challenge={challenges.find(item=>item.id===selectedPilot.challengeId)||INITIAL_GOV_CHALLENGES.find(item=>item.id===selectedPilot.challengeId)} startup={startup} onClose={()=>setSelectedPilotId(null)} onUpdate={onUpdatePilot} />}
    </div>
  );
}

function StartupCompanyProfilePage({ profile, proposalCount, pilotCount, onBack, onSave }) {
  const [form,setForm]=useState({...profile});
  const [editing,setEditing]=useState(false);
  const [errors,setErrors]=useState({});
  const [notice,setNotice]=useState('');
  const update=key=>event=>{
    setForm(previous=>({...previous,[key]:event.target.value}));
    setErrors(previous=>({...previous,[key]:''}));
    setNotice('');
  };

  function save(event) {
    event.preventDefault();
    const nextErrors={
      companyName:form.companyName.trim().length<2?'Enter a company name with at least 2 characters.':'',
      founderName:form.founderName.trim()?'':'Enter a founder or contact name.',
      email:!form.email.trim()?'Enter a contact email.':!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form.email.trim())?'Enter a valid email address.':'',
      domain:form.domain.trim()?'':'Enter an industry or technology domain.',
      location:form.location.trim()?'':'Enter a company location.',
      description:form.description.trim()?'':'Enter a short company description.',
      website:form.website.trim()&&!/^https?:\/\/.+/.test(form.website.trim())?'Enter a valid URL starting with http:// or https://':'',
    };
    setErrors(nextErrors);
    if(Object.values(nextErrors).some(Boolean))return;
    onSave({...form,companyName:form.companyName.trim(),founderName:form.founderName.trim(),email:form.email.trim(),domain:form.domain.trim(),location:form.location.trim(),description:form.description.trim(),website:form.website.trim()});
    setEditing(false);
    setNotice('Company profile updated for this demo session.');
  }

  const field=(key,label,options={})=>(
    <div className={`form-group${options.full?' startup-profile-full':''}`}>
      <label className="form-label" htmlFor={`startup-profile-${key}`}>{label}{options.optional&&<span className="settings-optional">Optional</span>}</label>
      {options.multiline
        ? <textarea id={`startup-profile-${key}`} className={`form-textarea${errors[key]?' mc-input-error':''}`} value={form[key]} onChange={update(key)} maxLength={options.maxLength||400} />
        : <input id={`startup-profile-${key}`} type={options.email?'email':'text'} className={`form-input${errors[key]?' mc-input-error':''}`} value={form[key]} onChange={update(key)} maxLength={options.maxLength||120} />}
      {errors[key]&&<span className="mc-field-error" role="alert">{errors[key]}</span>}
    </div>
  );
  const display=(label,value)=> <div className="startup-profile-detail"><span>{label}</span><strong>{value||'Not provided in demo data'}</strong></div>;
  const initials=profile.initials;

  return (
    <div className="page-content fade-in startup-company-profile-page">
      <div className="welcome-bar"><div><h1 className="mc-page-title">Company Profile</h1><p className="mc-page-subtitle">Review your startup details and proposal activity.</p></div><button className="btn-secondary" onClick={onBack}><Icon name="ArrowLeft" size={14} /> Overview</button></div>
      {notice&&<div className="mc-notice" role="status"><Icon name="CheckCircle" size={15} color="#0F9D8A" />{notice}<span className="startup-session-caption">Session only.</span></div>}
      <section className="card startup-profile-card">
        <div className="startup-profile-heading"><div className="startup-avatar" style={{background:profile.color}}>{initials}</div><div><h2>{profile.companyName}</h2><span>{profile.location||'Location not provided'}{profile.founded?` · Founded ${profile.founded}`:''}</span></div></div>
        {!editing
          ? <><p>{profile.description||'No company description provided.'}</p><div className="startup-profile-detail-grid">{display('Founder / contact',profile.founderName)}{display('Contact email',profile.email)}{display('Industry / domains',profile.domain)}{display('Location',profile.location)}{display('Website',profile.website)}</div><div className="startup-profile-counts"><div><strong>{proposalCount}</strong><span>Proposals</span></div><div><strong>{pilotCount}</strong><span>Pilots</span></div></div><div className="startup-profile-actions"><button type="button" className="btn-primary" onClick={()=>{setForm({...profile});setErrors({});setEditing(true);setNotice('');}}><Icon name="Pencil" size={14} color="#fff" /> Edit Profile</button></div></>
          : <form className="startup-profile-form" onSubmit={save} noValidate>
              <div className="startup-profile-form-grid">{field('companyName','Company name')}{field('founderName','Founder / contact name')}{field('email','Contact email',{email:true})}{field('domain','Industry / domains')}{field('location','Location')}{field('website','Website',{optional:true})}{field('description','Company description',{multiline:true,full:true,maxLength:400})}</div>
              <div className="startup-profile-actions"><button type="button" className="btn-secondary" onClick={()=>{setForm({...profile});setErrors({});setEditing(false);}}>Cancel</button><button type="submit" className="btn-primary"><Icon name="Save" size={14} color="#fff" /> Save Profile</button></div>
            </form>}
      </section>
      <p className="startup-session-footnote">Profile information and counts come from frontend demo data and this dashboard session.</p>
    </div>
  );
}

function StartupSettingsPage({ profile, defaults, preferences, onBack, onSave, onReset, onDensityChange }) {
  const [form,setForm]=useState(()=>({...profile}));
  const [notifications,setNotifications]=useState(()=>({...preferences.notifications}));
  const [density,setDensity]=useState(preferences.density);
  const [errors,setErrors]=useState({});
  const [notice,setNotice]=useState('');
  const [resetOpen,setResetOpen]=useState(false);
  const update=key=>event=>{
    setForm(previous=>({...previous,[key]:event.target.value}));
    setErrors(previous=>({...previous,[key]:''}));
    setNotice('');
  };
  const toggle=key=>{
    setNotifications(previous=>({...previous,[key]:!previous[key]}));
    setNotice('');
  };

  function save(event) {
    event.preventDefault();
    const nextErrors={
      companyName:form.companyName.trim().length<2?'Enter a company display name.':'',
      domain:form.domain.trim()?'':'Enter an industry or domain.',
      location:form.location.trim()?'':'Enter a company location.',
    };
    setErrors(nextErrors);
    if(Object.values(nextErrors).some(Boolean))return;
    onSave({...profile,companyName:form.companyName.trim(),domain:form.domain.trim(),location:form.location.trim()},{notifications:{...notifications},density});
    setNotice('Startup settings saved for this demo session.');
  }
  function confirmReset() {
    onReset();
    setForm({...defaults});
    setNotifications({challengeMatches:true,proposalUpdates:true,pilotMilestones:true});
    setDensity('comfortable');
    onDensityChange('comfortable');
    setErrors({});
    setNotice('Startup settings reset for this demo session.');
    setResetOpen(false);
  }
  const orgField=(key,label)=> <div className="form-group"><label className="form-label" htmlFor={`startup-settings-${key}`}>{label}</label><input id={`startup-settings-${key}`} className={`form-input${errors[key]?' mc-input-error':''}`} value={form[key]} onChange={update(key)} maxLength={100} />{errors[key]&&<span className="mc-field-error" role="alert">{errors[key]}</span>}</div>;

  return (
    <div className={`page-content settings-page density-${density} startup-settings-page`}>
      <div className="welcome-bar"><div><h1 className="mc-page-title">Settings</h1><p className="mc-page-subtitle">Manage startup preferences for this demo session.</p></div><span className="badge badge-blue">Session only</span></div>
      {notice&&<div className="mc-notice" role="status"><Icon name="CheckCircle" size={15} color="#0F9D8A" />{notice}</div>}
      <form className="settings-form" onSubmit={save} noValidate>
        <section className="card settings-section"><div className="settings-section-heading"><div className="settings-section-icon"><Icon name="Building2" size={17} color="#0F9D8A" /></div><div><h2>Organization preferences</h2><p>These details are shared with the Company Profile for this dashboard session.</p></div></div><div className="settings-grid">{orgField('companyName','Company display name')}{orgField('domain','Industry / domain')}<div className="settings-full">{orgField('location','Location')}</div></div></section>
        <section className="card settings-section"><div className="settings-section-heading"><div className="settings-section-icon settings-icon-amber"><Icon name="BellRing" size={17} color="#b45309" /></div><div><h2>Notification preferences</h2><p>Choose which frontend demo activity you want to follow.</p></div></div><div className="settings-options">{[['challengeMatches','Challenge matches','When challenges match your startup domains.'],['proposalUpdates','Proposal updates','When a submitted proposal receives a status update.'],['pilotMilestones','Pilot milestones','When progress or milestone records change.']].map(([key,label,description])=><label className="settings-option" key={key}><span><strong>{label}</strong><small>{description}</small></span><input type="checkbox" checked={notifications[key]} onChange={()=>toggle(key)} aria-label={label} /></label>)}</div></section>
        <section className="card settings-section"><div className="settings-section-heading"><div className="settings-section-icon"><Icon name="SlidersHorizontal" size={17} color="#173C70" /></div><div><h2>Display preferences</h2><p>Choose spacing for supported dashboard lists and cards.</p></div></div><fieldset className="settings-density"><legend>Content density</legend><div className="settings-segment" role="radiogroup" aria-label="Startup content density">{[['comfortable','Comfortable'],['compact','Compact']].map(([value,label])=><button type="button" role="radio" aria-checked={density===value} className={density===value?'is-selected':''} key={value} onClick={()=>{setDensity(value);onDensityChange(value);setNotice('');}}>{label}</button>)}</div></fieldset></section>
        <div className="settings-footer"><button type="button" className="btn-secondary" onClick={()=>setResetOpen(true)}><Icon name="RotateCcw" size={14} /> Reset to Defaults</button><button type="submit" className="btn-primary"><Icon name="Save" size={14} color="#fff" /> Save Settings</button></div>
      </form>
      <p className="startup-session-footnote">Preferences apply only to this dashboard session. Nothing is sent to a server.</p>
      {resetOpen&&<div className="modal-overlay settings-modal" onClick={event=>{if(event.target===event.currentTarget)setResetOpen(false);}}><div className="modal-box" role="dialog" aria-modal="true" aria-labelledby="startup-settings-reset-title"><div className="modal-header"><span className="modal-title" id="startup-settings-reset-title">Reset startup settings?</span><button type="button" className="icon-btn" onClick={()=>setResetOpen(false)} aria-label="Close reset confirmation"><Icon name="X" size={16} /></button></div><div className="modal-body"><p className="settings-reset-copy">Restore organization details and preferences to their current demo defaults for this session?</p></div><div className="modal-footer"><button type="button" className="btn-secondary" onClick={()=>setResetOpen(false)}>Keep Settings</button><button type="button" className="settings-reset-confirm" onClick={confirmReset}><Icon name="RotateCcw" size={14} /> Reset Settings</button></div></div></div>}
    </div>
  );
}

// ── Startup Dashboard ─────────────────────────────────────────────────────────
function StartupDashboard({ setPage }) {
  const [activeNav, setActiveNav] = useState('overview');
  const [savedChallengeIds,setSavedChallengeIds] = useState([]);
  const [startupProposals,setStartupProposals] = useState(() => INITIAL_GOV_PROPOSALS.filter(proposal => proposal.startupId === 2));
  const [startupPilotRecords,setStartupPilotRecords] = useState(() => INITIAL_GOV_PILOTS.filter(pilot => pilot.startupId === 2).map(pilot => ({ ...pilot, milestones:pilot.milestones.map(milestone => ({ ...milestone })) })));
  const registeredStartup = PUBLIC_STARTUPS.find(item => item.id === 2) || PUBLIC_STARTUPS[0];
  const [startupProfile,setStartupProfile] = useState(() => ({
    companyName:registeredStartup.name,
    initials:registeredStartup.initials,
    founderName:'',
    email:'',
    domain:registeredStartup.tags.join(', '),
    location:registeredStartup.location,
    website:'',
    description:registeredStartup.desc,
    founded:registeredStartup.founded,
    color:registeredStartup.color,
  }));
  const startupProfileDefaults = {
    companyName:registeredStartup.name,
    initials:registeredStartup.initials,
    founderName:'',
    email:'',
    domain:registeredStartup.tags.join(', '),
    location:registeredStartup.location,
    website:'',
    description:registeredStartup.desc,
    founded:registeredStartup.founded,
    color:registeredStartup.color,
  };
  const [startupPreferences,setStartupPreferences] = useState({notifications:{challengeMatches:true,proposalUpdates:true,pilotMilestones:true},density:'comfortable'});
  const navItems = [
    { id:'overview',    label:'Overview',          icon:'LayoutDashboard' },
    { id:'challenges',  label:'Browse Challenges', icon:'Search' },
    { id:'proposals',   label:'My Proposals',      icon:'FileText' },
    { id:'pilot',       label:'Active Pilot',      icon:'Rocket' },
    { id:'profile',     label:'Company Profile',   icon:'Building2' },
    { id:'settings',    label:'Settings',          icon:'Settings' },
  ];
  const startup = {...registeredStartup,name:startupProfile.companyName,initials:startupProfile.initials,desc:startupProfile.description,location:startupProfile.location,tags:startupProfile.domain.split(',').map(tag=>tag.trim()).filter(Boolean)};
  const startupMatches = INITIAL_GOV_MATCHES.filter(match => match.id === startup.id);
  const startupPilots = startupPilotRecords.filter(pilot => pilot.startupId === startup.id);
  const activePilots = startupPilots.filter(pilot => ['In Progress','Delayed'].includes(pilot.status));
  const startupTags = new Set(startup.tags.map(tag => tag.toLowerCase()));
  const recommendedChallenges = PUBLIC_CHALLENGES.map(challenge => {
    const sharedTags = challenge.tags.filter(tag => startupTags.has(tag.toLowerCase()));
    const linkedChallenge = INITIAL_GOV_CHALLENGES.find(item => item.title === challenge.title);
    const match = startupMatches.find(item => item.challengeId === (linkedChallenge?.id || challenge.id));
    return { ...challenge, sharedTags, matchScore:match?.matchScore || null };
  }).filter(challenge => challenge.sharedTags.length)
    .sort((left,right) => Number(!!right.matchScore)-Number(!!left.matchScore) || right.sharedTags.length-left.sharedTags.length)
    .slice(0,4);
  const recentActivity = [
    ...startupProposals.map(proposal => ({ id:`proposal-${proposal.id}`, date:proposal.submissionDate, icon:'FileText', title:'Proposal submitted', detail:proposal.title, status:proposal.status, badge:proposal.status==='Accepted'?'badge-teal':proposal.status==='Pending Review'?'badge-amber':'badge-blue' })),
    ...startupPilots.map(pilot => ({ id:`pilot-${pilot.id}`, date:pilot.startDate, icon:'Rocket', title:'Pilot record', detail:pilot.name, status:pilot.status, badge:pilot.status==='Completed'?'badge-teal':pilot.status==='Delayed'?'badge-amber':'badge-blue' })),
  ].sort((left,right) => right.date.localeCompare(left.date)).slice(0,4);
  const stats = [
    { value:startupMatches.length, label:'Matched Challenges', icon:'Target', bg:'#EBF2FF', color:'#173C70' },
    { value:startupProposals.length, label:'Submitted Proposals', icon:'FileText', bg:'#E6F7F5', color:'#0F9D8A' },
    { value:startupProposals.filter(proposal => proposal.status === 'Accepted').length, label:'Accepted Proposals', icon:'CheckCircle', bg:'#FFF4E5', color:'#b45309' },
    { value:activePilots.length, label:'Active Pilots', icon:'Rocket', bg:'#F3EEFF', color:'#6d28d9' },
  ];
  return (
    <div className={`app-shell startup-shell density-${startupPreferences.density}`}>
      <aside className="sidebar">
        <div className="sidebar-logo">
          <div style={{ display:'flex', alignItems:'center', gap:10 }}>
            <div className="logo-mark"><Icon name="Rocket" size={18} color="#fff" /></div>
            <div>
              <div className="logo-text">{startup.name}</div>
              <div className="logo-sub">Startup Portal</div>
            </div>
          </div>
        </div>
        <nav className="nav-section">
          {navItems.map(item => (
            <div key={item.id} className={`nav-item${activeNav===item.id?' active':''}`} onClick={() => setActiveNav(item.id)}>
              <Icon name={item.icon} size={16} color={activeNav===item.id ? '#0F9D8A' : 'rgba(255,255,255,0.65)'} />
              <span className="nav-label">{item.label}</span>
            </div>
          ))}
          <div style={{ marginTop:'auto', paddingTop:16 }}>
            <div className="nav-item" onClick={() => setPage('home')}>
              <Icon name="LogOut" size={16} color="rgba(255,255,255,0.65)" />
              <span className="nav-label">Exit to Homepage</span>
            </div>
          </div>
        </nav>
      </aside>
      <div className="main-area">
        <header className="top-header">
          <div style={{ flex:1 }}>
            <div style={{ fontSize:11, color:'#667085' }}>Startup Portal / {navItems.find(n=>n.id===activeNav)?.label}</div>
            <div style={{ fontSize:15, fontWeight:700, color:'#182230' }}>Startup Dashboard</div>
          </div>
          <div className="avatar" style={{ background:startup.color }}>{startup.initials}</div>
          <div>
            <div style={{ fontSize:12, fontWeight:600, color:'#182230' }}>{startup.name}</div>
            <div style={{ fontSize:11, color:'#667085' }}>Startup</div>
          </div>
        </header>
        {activeNav === 'overview'
          ? <StartupDashboardOverview startup={startup} stats={stats} recommendedChallenges={recommendedChallenges} recentActivity={recentActivity} onNavigate={setActiveNav} />
          : activeNav === 'challenges'
              ? <StartupChallengesPage startup={startup} challenges={PUBLIC_CHALLENGES} matches={startupMatches} savedChallengeIds={savedChallengeIds} onToggleSave={id=>setSavedChallengeIds(previous=>previous.includes(id)?previous.filter(savedId=>savedId!==id):[...previous,id])} onSubmitProposal={proposal=>setStartupProposals(previous=>[proposal,...previous])} onViewProposals={()=>setActiveNav('proposals')} onBack={() => setActiveNav('overview')} />
            : activeNav === 'proposals'
              ? <StartupProposalsPage startup={startup} proposals={startupProposals} challenges={PUBLIC_CHALLENGES} onBack={() => setActiveNav('overview')} onUpdateProposal={updated=>setStartupProposals(previous=>previous.map(proposal=>proposal.id===updated.id?updated:proposal))} />
              : activeNav === 'pilot'
                ? <StartupPilotPage startup={startup} pilots={startupPilots} challenges={PUBLIC_CHALLENGES} onBack={() => setActiveNav('overview')} onUpdatePilot={updated=>setStartupPilotRecords(previous=>previous.map(pilot=>pilot.id===updated.id?updated:pilot))} />
                : activeNav === 'profile'
                  ? <StartupCompanyProfilePage profile={startupProfile} proposalCount={startupProposals.length} pilotCount={startupPilots.length} onBack={()=>setActiveNav('overview')} onSave={updated=>setStartupProfile({...updated,initials:updated.companyName===registeredStartup.name?registeredStartup.initials:updated.companyName.split(/\s+/).filter(Boolean).slice(0,2).map(word=>word[0]).join('').toUpperCase()||'ST'})} />
                  : <StartupSettingsPage profile={startupProfile} defaults={startupProfileDefaults} preferences={startupPreferences} onBack={()=>setActiveNav('overview')} onSave={(updatedProfile,updatedPreferences)=>{setStartupProfile({...updatedProfile,initials:updatedProfile.companyName===registeredStartup.name?registeredStartup.initials:updatedProfile.companyName.split(/\s+/).filter(Boolean).slice(0,2).map(word=>word[0]).join('').toUpperCase()||'ST'});setStartupPreferences(updatedPreferences);}} onReset={()=>{setStartupProfile({...startupProfileDefaults});setStartupPreferences({notifications:{challengeMatches:true,proposalUpdates:true,pilotMilestones:true},density:'comfortable'});}} onDensityChange={density=>setStartupPreferences(previous=>({...previous,density}))} />
        }
      </div>
    </div>
  );
}

function matchStatusBadge(status) {
  if (status === 'Pending Review') return 'badge-amber';
  if (status === 'Shortlisted') return 'badge-teal';
  if (status === 'Proposal Submitted') return 'badge-purple';
  return 'badge-blue';
}

function matchScoreTone(score) {
  if (score >= 85) return 'high';
  if (score >= 80) return 'good';
  return 'moderate';
}

function ChallengeEditorModal({ challenge, onClose, onSave }) {
  const creating = !challenge;
  const [form, setForm] = useState(() => challenge || {
    title:'', category:'', status:'Active', deadline:'', description:'', applications:0,
  });
  const [errors, setErrors] = useState({});

  useEffect(() => {
    const onKey = event => { if (event.key === 'Escape') onClose(); };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [onClose]);

  const update = key => event => {
    const value = event.target.value;
    setForm(previous => ({ ...previous, [key]:value }));
    setErrors(previous => ({ ...previous, [key]:'' }));
  };

  function submit(event) {
    event.preventDefault();
    const nextErrors = {
      ...validateChallengeBasics(form),
      description: form.description.length > 300 ? 'Keep the description to 300 characters or fewer.' : '',
    };
    setErrors(nextErrors);
    if (Object.values(nextErrors).some(Boolean)) return;
    onSave({ ...form, title:form.title.trim(), description:form.description.trim() });
  }

  return (
    <div className="modal-overlay mc-modal" onClick={event => { if (event.target === event.currentTarget) onClose(); }}>
      <div className="modal-box">
        <form onSubmit={submit} noValidate>
          <div className="modal-header">
            <span className="modal-title">{creating ? 'Post Challenge' : 'Edit Challenge'}</span>
            <button type="button" className="icon-btn" onClick={onClose} aria-label="Close"><Icon name="X" size={16} /></button>
          </div>
          <div className="modal-body">
            <div className="mc-form-grid">
              <div className="form-group">
                <label className="form-label" htmlFor="mc-title">Challenge title</label>
                <input id="mc-title" className={`form-input${errors.title ? ' mc-input-error' : ''}`} value={form.title} onChange={update('title')} aria-invalid={!!errors.title} aria-describedby={errors.title ? 'mc-title-error' : undefined} maxLength={100} />
                {errors.title && <div id="mc-title-error" className="mc-field-error" role="alert">{errors.title}</div>}
              </div>
              <div className="form-group">
                <label className="form-label" htmlFor="mc-category">Category</label>
                <select id="mc-category" className={`form-select${errors.category ? ' mc-input-error' : ''}`} value={form.category} onChange={update('category')} aria-invalid={!!errors.category}>
                  <option value="">Select category…</option>
                  {CHALLENGE_CATEGORIES.map(category => <option key={category} value={category}>{category}</option>)}
                </select>
                {errors.category && <div className="mc-field-error" role="alert">{errors.category}</div>}
              </div>
              <div className="form-group">
                <label className="form-label" htmlFor="mc-status">Status</label>
                <select id="mc-status" className={`form-select${errors.status ? ' mc-input-error' : ''}`} value={form.status} onChange={update('status')} aria-invalid={!!errors.status}>
                  {['Active','Under Review','Completed'].map(status => <option key={status} value={status}>{status}</option>)}
                </select>
                {errors.status && <div className="mc-field-error" role="alert">{errors.status}</div>}
              </div>
              <div className="form-group">
                <label className="form-label" htmlFor="mc-deadline">Application deadline</label>
                <input id="mc-deadline" type="date" className={`form-input${errors.deadline ? ' mc-input-error' : ''}`} value={form.deadline} onChange={update('deadline')} aria-invalid={!!errors.deadline} />
                {errors.deadline && <div className="mc-field-error" role="alert">{errors.deadline}</div>}
              </div>
            </div>
            <div className="form-group">
              <label className="form-label" htmlFor="mc-description">Description <span className="mc-optional">Optional</span></label>
              <textarea id="mc-description" className={`form-textarea${errors.description ? ' mc-input-error' : ''}`} value={form.description} onChange={update('description')} maxLength={300} aria-invalid={!!errors.description} />
              <div className="mc-character-count">{form.description.length}/300</div>
              {errors.description && <div className="mc-field-error" role="alert">{errors.description}</div>}
            </div>
          </div>
          <div className="modal-footer">
            <button type="button" className="btn-secondary" onClick={onClose}>Cancel</button>
            <button type="submit" className="btn-primary"><Icon name="Check" size={14} color="#fff" /> {creating ? 'Create Challenge' : 'Save Changes'}</button>
          </div>
        </form>
      </div>
    </div>
  );
}
