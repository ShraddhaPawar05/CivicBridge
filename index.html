          </div>
        </div>

        <div className="post-form-section">
          <div className="post-form-section-heading">
            <h2>Funding and timeline</h2>
            <p>Set the available budget and application deadline.</p>
          </div>
          <div className="post-form-grid">
            <div className="form-group">
              <label className="form-label" htmlFor="post-budget-min">Minimum budget (INR) <span className="post-required">Required</span></label>
              <input id="post-budget-min" type="number" min="1" step="1000" className={`form-input${attempted && errors.budgetMin ? ' mc-input-error' : ''}`} value={form.budgetMin} onChange={update('budgetMin')} placeholder="e.g. 50000" aria-invalid={attempted && !!errors.budgetMin} />
              {attempted && errors.budgetMin && <div className="mc-field-error" role="alert">{errors.budgetMin}</div>}
            </div>
            <div className="form-group">
              <label className="form-label" htmlFor="post-budget-max">Maximum budget (INR) <span className="post-required">Required</span></label>
              <input id="post-budget-max" type="number" min="1" step="1000" className={`form-input${attempted && errors.budgetMax ? ' mc-input-error' : ''}`} value={form.budgetMax} onChange={update('budgetMax')} placeholder="e.g. 250000" aria-invalid={attempted && !!errors.budgetMax} />
              {attempted && errors.budgetMax && <div className="mc-field-error" role="alert">{errors.budgetMax}</div>}
            </div>
            <div className="form-group">
              <label className="form-label" htmlFor="post-deadline">Application deadline <span className="post-required">Required</span></label>

const GOV_PAGE_TITLES = {
  challenges:'My Challenges', post:'Post Challenge', matches:'Startup Matches',
  proposals:'Proposals', evaluation:'Evaluation', pilot:'Pilot Tracking',
  performance:'Performance', settings:'Settings',
};

function GovDashboard({ setPage }) {
  const [activeNav, setActiveNav]               = useState('dashboard');
  const [sidebarCollapsed, setSidebarCollapsed] = useState(false);
  const [govChallenges, setGovChallenges]       = useState(INITIAL_GOV_CHALLENGES);
  const [govMatches, setGovMatches]             = useState(INITIAL_GOV_MATCHES);
  const [govProposals, setGovProposals]         = useState(INITIAL_GOV_PROPOSALS);
  const [govEvaluations, setGovEvaluations]     = useState(INITIAL_GOV_EVALUATIONS);
  const [govPilots, setGovPilots]               = useState(INITIAL_GOV_PILOTS);
  const [govSettings, setGovSettings]           = useState(() => ({ ...INITIAL_GOV_SETTINGS, notifications:{ ...INITIAL_GOV_SETTINGS.notifications } }));
  const [displayDensity, setDisplayDensity]     = useState(INITIAL_GOV_SETTINGS.density);
  const [challengeSearchSeed, setChallengeSearchSeed] = useState('');

  function saveGovSettings(settings) {
    setGovSettings(settings);
    setDisplayDensity(settings.density);
  }

  function changeDisplayDensity(density) {
    setDisplayDensity(density);
    setGovSettings(previous => ({ ...previous, density }));
  }

  function openRelatedChallenge(challengeId) {
    const challenge = govChallenges.find(item => item.id === challengeId);
    setChallengeSearchSeed(challenge?.title || '');
    setActiveNav('challenges');
  }

  return (
    <div className={`app-shell${activeNav === 'proposals' ? ' proposals-shell' : activeNav === 'evaluation' ? ' evaluation-shell' : activeNav === 'pilot' ? ' pilot-shell' : activeNav === 'performance' ? ' performance-shell' : activeNav === 'settings' ? ' settings-shell' : ''}${displayDensity === 'compact' ? ' density-compact' : ''}`}>
      <GovSidebar active={activeNav} onSelect={id => { if (id === 'challenges') setChallengeSearchSeed(''); setActiveNav(id); }} collapsed={sidebarCollapsed} onExit={() => setPage('home')} />
      <div className="main-area">
        <GovHeader onToggleSidebar={() => setSidebarCollapsed(c => !c)} profile={govSettings} />
        {activeNav === 'dashboard'
          ? <DashboardPage />
          : activeNav === 'challenges'
            ? <MyChallengesPage challenges={govChallenges} setChallenges={setGovChallenges} initialSearch={challengeSearchSeed} />
            : activeNav === 'matches'
              ? <StartupMatchesPage matches={govMatches} setMatches={setGovMatches} challenges={govChallenges} onOpenChallenge={openRelatedChallenge} />
              : activeNav === 'proposals'
                ? <ProposalsPage proposals={govProposals} setProposals={setGovProposals} challenges={govChallenges} onOpenChallenge={openRelatedChallenge} />
              : activeNav === 'evaluation'
                ? <EvaluationPage proposals={govProposals} evaluations={govEvaluations} setEvaluations={setGovEvaluations} startups={govMatches} challenges={govChallenges} onOpenChallenge={openRelatedChallenge} />
              : activeNav === 'pilot'
                ? <PilotTrackingPage pilots={govPilots} setPilots={setGovPilots} challenges={govChallenges} startups={govMatches} onOpenChallenge={openRelatedChallenge} />
              : activeNav === 'performance'
                ? <PerformancePage challenges={govChallenges} matches={govMatches} proposals={govProposals} evaluations={govEvaluations} pilots={govPilots} onOpenChallenge={openRelatedChallenge} />
              : activeNav === 'settings'
                ? <SettingsPage settings={govSettings} onSave={saveGovSettings} onReset={saveGovSettings} onDensityChange={changeDisplayDensity} />
            : activeNav === 'post'
              ? <PostChallengePage
                  onCreate={challenge => setGovChallenges(previous => [{ ...challenge, id:Date.now() }, ...previous])}
                  onCancel={() => setActiveNav('dashboard')}
                  onViewChallenges={() => setActiveNav('challenges')}
                />
            : <GovInnerPage title={GOV_PAGE_TITLES[activeNav] || activeNav} />
        }
      </div>
    </div>
  );
}

// Validation helpers reused by all three registration forms.
function validateRegEmail(v) {
  if (!v.trim()) return 'Email address is required.';
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim())) return 'Enter a valid email address.';
  return '';
}
function validatePassword(v) {
  if (!v) return 'Password is required.';
  if (v.length < 8) return 'Password must be at least 8 characters.';
  return '';
}
function validateConfirm(pw, confirm) {
  if (!confirm) return 'Please confirm your password.';
  if (pw !== confirm) return 'Passwords do not match.';
  return '';
}

// ── Top-level App Router ──────────────────────────────────────────────────────
function App() {
  const [page, setPage] = useState('home');

  // Pages that use the full-screen dashboard shell (no public nav/footer)
  const dashboardPages = ['govDashboard', 'startupDashboard', 'evaluatorDashboard'];
  const authPages      = ['login', 'register', 'roleSelect'];

  if (page === 'govDashboard')       return <GovDashboard setPage={setPage} />;
  if (page === 'startupDashboard')   return <StartupDashboard setPage={setPage} />;
  if (page === 'evaluatorDashboard') return <EvaluatorDashboard setPage={setPage} />;
  if (page === 'login')              return <LoginPage setPage={setPage} />;
  if (page === 'register' || page === 'roleSelect') return <RoleSelectPage setPage={setPage} />;
  if (page === 'govRegister')        return <GovRegisterPage setPage={setPage} />;
  if (page === 'startupRegister')    return <StartupRegisterPage setPage={setPage} />;
  if (page === 'evaluatorRegister')  return <EvaluatorRegisterPage setPage={setPage} />;

  // Public site pages — wrapped with nav + footer
  const renderPage = () => {
    if (page === 'home')       return <HomePage setPage={setPage} />;
    if (page === 'challenges') return <ChallengesPage setPage={setPage} />;
    if (page === 'startups')   return <StartupsPage setPage={setPage} />;
    if (page === 'how')        return <HowItWorksPage setPage={setPage} />;
    if (page === 'about')      return <AboutPage setPage={setPage} />;
    return <HomePage setPage={setPage} />;
  };

  return (
    <div style={{ minHeight:'100vh', display:'flex', flexDirection:'column', background:'#fff' }}>
      <PublicNav page={page} setPage={setPage} />
      <div style={{ flex:1 }}>
        {renderPage()}
      </div>
      <PublicFooter setPage={setPage} />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
